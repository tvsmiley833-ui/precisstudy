<!--
  This page only exists so a shared challenge link (?challenge=CODE) still
  gets a real, code-specific Open Graph preview from withLinkPreview() in
  src/worker.ts -- link-unfurl crawlers (iMessage, Slack, Discord, ...) read
  the meta tags above (rewritten server-side per challenge) but never run the
  script below. Every real browser gets bounced straight to the merged
  /compete/ page's Challenge tab, with the same query string.
-->
<script>
(function(){
  var params = new URLSearchParams(location.search);
  location.replace('/compete/?tab=challenge' + (params.toString() ? '&' + params.toString() : ''));
})();
</script>
</head>
<body>
<noscript><a href="/compete/?tab=challenge">Continue to Peer Challenge</a></noscript>
</body>
