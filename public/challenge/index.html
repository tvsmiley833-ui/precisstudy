<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Peer Challenge — PrecisStudy</title>
<meta name="description" content="Challenge a friend to a head-to-head quiz duel on any subject -- share a code, both take the same questions whenever you get to it, then compare scores."/>
<meta property="og:title" content="Peer Challenge — PrecisStudy"/>
<meta property="og:description" content="A classmate challenged you to a head-to-head quiz on PrecisStudy. Free, no sign-up needed to look."/>
<meta property="og:type" content="website"/>
<meta property="og:url" content="https://precisstudy.com/challenge"/>
<meta property="og:image" content="https://precisstudy.com/logo-full.png"/>
<meta name="twitter:card" content="summary"/>
<meta name="twitter:title" content="Peer Challenge — PrecisStudy"/>
<meta name="twitter:description" content="A classmate challenged you to a head-to-head quiz on PrecisStudy. Free, no sign-up needed to look."/>
<meta name="robots" content="noindex"/>
<link rel="icon" type="image/png" href="/favicon.png"/>
<link rel="apple-touch-icon" href="/apple-touch-icon.png"/>
<link rel="preload" href="/fonts/nunito-latin.woff2" as="font" type="font/woff2" crossorigin/>
<link rel="stylesheet" href="/fonts/nunito.css"/>
<script>
(function(){
  try {
    var saved = localStorage.getItem('ss-theme');
    if (saved !== 'light') document.documentElement.setAttribute('data-theme', 'dark');
  } catch (e) {}
})();
</script>
<style>
:root{
  --bg:#eef1ea; --bg-card:#fff; --bg-header:#ffffff;
  --border:#c8d2c5;
  --text:#233a31; --text-body:#33493d; --text-muted:#5a6f63; --nav-text:#3d5347;
  --accent:#1f6e46; --accent-bright:#268a58; --accent-hover:#175a39; --accent-solid:#1f6e46; --accent-solid-hover:#175a39;
  --chip-bg:#dde8df; --chip-text:#175a39;
  --danger:#b23a3a; --danger-soft:#fbeaea;
  --card-shadow:0 1px 3px rgba(35,58,49,.06),0 24px 48px -28px rgba(35,58,49,.20);
}
[data-theme="dark"]{
  --bg:#14302a; --bg-card:#1b3d33; --bg-header:#12291f;
  --border:#2f5346;
  --text:#f2f5ee; --text-body:#dbe6dd; --text-muted:#b7c9bc; --nav-text:#eef2ea;
  --accent:#4fbf85; --accent-bright:#63d199; --accent-hover:#3fa873; --accent-solid:#237750; --accent-solid-hover:#1a6644;
  --chip-bg:#22362c; --chip-text:#63d199;
  --danger:#f16565; --danger-soft:rgba(241,101,101,.14);
  --card-shadow:0 1px 3px rgba(0,0,0,.32),0 24px 48px -28px rgba(0,0,0,.5);
}
#theme-toggle{background:none;border:1px solid var(--border);color:var(--text-muted);border-radius:999px;
  width:34px;height:34px;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0}
#theme-toggle:hover{border-color:var(--accent-bright);color:var(--accent)}
#theme-toggle svg{width:17px;height:17px}
#theme-toggle .icon-sun{display:none}
[data-theme="dark"] #theme-toggle .icon-moon{display:none}
[data-theme="dark"] #theme-toggle .icon-sun{display:block}
[data-theme="dark"] .ss-logo-light{display:none!important}
[data-theme="dark"] .ss-logo-dark{display:inline!important}

.ss-oauth-btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;box-sizing:border-box;
  padding:10px 14px;border-radius:12px;border:2px solid var(--border);background:var(--bg-card);color:var(--text);
  font-family:inherit;font-size:14px;font-weight:700;cursor:pointer;text-decoration:none;margin-bottom:9px;transition:all .15s}
.ss-oauth-btn:hover{border-color:var(--accent-bright);background:var(--bg)}
@media(max-width:640px){.header-bar{padding:14px 16px} .nav-links{gap:10px} .nav-hide-sm{display:none}}

html{scroll-behavior:smooth}
.ss-card{background:var(--bg-card);border:2px solid var(--border);border-radius:18px;padding:28px;box-shadow:var(--card-shadow)}
.ss-btn{padding:10px 20px;border-radius:999px;border:1px solid var(--border);background:var(--bg-card);color:var(--text);
  font-family:inherit;font-size:15px;font-weight:700;cursor:pointer;transition:all .15s}
.ss-btn:hover{border-color:var(--accent-bright);color:var(--accent)}
.ss-btn:disabled{opacity:.55;cursor:default}
.ss-btn-solid{background:var(--accent-solid);border-color:var(--accent-solid);color:#fff}
.ss-btn-solid:hover{background:var(--accent-solid-hover);border-color:var(--accent-solid-hover);color:#fff}
select,input[type=text]{width:100%;box-sizing:border-box;padding:10px 14px;border:1px solid var(--border);
  border-radius:10px;background:var(--bg);color:var(--text);font-family:inherit;font-size:15px}
label.ss-label{display:block;font-weight:700;font-size:13.5px;color:var(--text-muted);margin-bottom:6px}
.ss-field{margin-bottom:18px}
:focus-visible{outline:2px solid var(--accent-bright);outline-offset:2px;border-radius:6px}
.ch-code-box{display:flex;align-items:center;gap:8px;background:var(--bg);border:1px dashed var(--border);border-radius:10px;
  padding:10px 14px;font-family:monospace;font-size:18px;font-weight:800;letter-spacing:2px;color:var(--accent);width:fit-content}
.ch-vs{display:flex;align-items:center;justify-content:space-around;gap:16px;text-align:center;margin:18px 0;flex-wrap:wrap}
.ch-vs-side{flex:1;min-width:120px}
.ch-vs-name{font-weight:800;font-size:14.5px;color:var(--text);margin-bottom:6px;word-break:break-word}
.ch-vs-score{font-size:32px;font-weight:800;color:var(--accent)}
.ch-vs-pct{font-size:12.5px;color:var(--text-muted)}
.ch-vs-mid{font-weight:800;color:var(--text-muted);font-size:14px}
.ch-q{margin-bottom:16px}
.ch-q-text{font-weight:700;font-size:15px;color:var(--text);margin-bottom:10px}
.ch-opt{display:block;width:100%;text-align:left;padding:10px 14px;border-radius:10px;border:1px solid var(--border);
  background:var(--bg);color:var(--text);font-family:inherit;font-size:14.5px;cursor:pointer;margin-bottom:8px}
.ch-opt:hover{border-color:var(--accent-bright)}
.ch-opt.picked{border-color:var(--accent);background:var(--chip-bg)}
.ch-list-row{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0;border-bottom:1px solid var(--border);font-size:14px}
.ch-list-row:last-child{border-bottom:none}
.ch-badge{font-size:11.5px;font-weight:700;padding:3px 9px;border-radius:999px;background:var(--chip-bg);color:var(--chip-text)}
</style>
</head>
<body style="margin:0;font-family:'Nunito','Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--text);">

<div role="banner" class="header-bar" style="display:flex;align-items:center;justify-content:space-between;padding:18px 32px;background:var(--bg-header);border-bottom:1px solid var(--border);">
  <a href="/" style="font-weight:800;font-size:22px;color:var(--nav-text);display:flex;align-items:center;gap:8px;text-decoration:none;">
    <span style="display:inline-block;width:28px;height:28px;position:relative;flex-shrink:0;"><img src="/logo-icon.png" alt="" width="28" height="28" style="border-radius:6px;position:absolute;inset:0;" class="ss-logo-light"/><img src="/logo-icon-dark.png" alt="" width="28" height="28" style="border-radius:6px;position:absolute;inset:0;display:none;" class="ss-logo-dark"/></span>PrecisStudy
  </a>
  <div role="navigation" aria-label="Main" class="nav-links" style="display:flex;gap:16px;font-weight:600;font-size:15px;color:var(--nav-text);align-items:center;">
    <a href="/dashboard" class="nav-hide-sm" style="color:var(--nav-text);text-decoration:none;">Dashboard</a>
    <a href="/leaderboards" class="nav-hide-sm" style="color:var(--nav-text);text-decoration:none;">Leaderboards</a>
    <button id="theme-toggle" onclick="ssToggleTheme()" aria-label="Toggle dark mode" title="Toggle dark mode">
      <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
      <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
    </button>
    <a href="/geometry" class="ss-btn ss-btn-solid" style="text-decoration:none;">Back to Site</a>
  </div>
</div>

<div style="max-width:640px;margin:0 auto;padding:48px 24px 80px;">
  <h1 style="font-size:28px;font-weight:800;color:var(--text);margin:0 0 6px;">Peer Challenge</h1>
  <p style="font-size:15px;color:var(--text-muted);margin:0 0 28px;">Challenge a friend to the same set of quiz questions, whenever they get to it, then see who scored higher.</p>

  <div id="ch-gate" style="display:none;">
    <div class="ss-card" style="text-align:center;">
      <p id="ch-gate-msg" style="font-size:16px;color:var(--text);margin:0 0 16px;">Sign in to create or take a challenge.</p>
      <div id="ch-login-box" style="max-width:280px;margin:0 auto;"></div>
    </div>
  </div>

  <div id="ch-app" style="display:none;">
    <!-- Existing / shared challenge -->
    <div id="ch-view-info" class="ss-card" style="display:none;margin-bottom:24px;">
      <div id="ch-info-body"></div>
    </div>

    <!-- Quiz-taking view -->
    <div id="ch-view-quiz" class="ss-card" style="display:none;margin-bottom:24px;">
      <div id="ch-quiz-body"></div>
    </div>

    <!-- Result comparison -->
    <div id="ch-view-result" class="ss-card" style="display:none;margin-bottom:24px;">
      <div id="ch-result-body"></div>
    </div>

    <!-- Create flow -->
    <div id="ch-view-create" class="ss-card" style="margin-bottom:24px;">
      <div style="font-weight:800;font-size:16px;color:var(--text);margin-bottom:12px;">Start a new challenge</div>
      <div class="ss-field">
        <label class="ss-label" for="ch-subject-select">Subject</label>
        <select id="ch-subject-select"></select>
      </div>
      <div class="ss-field">
        <label class="ss-label" for="ch-count-select">Number of questions</label>
        <select id="ch-count-select">
          <option value="8">8 questions</option>
          <option value="10" selected>10 questions</option>
        </select>
      </div>
      <button class="ss-btn ss-btn-solid" id="ch-create-btn" onclick="chCreate()">Create challenge</button>
      <div id="ch-create-status" style="margin-top:10px;font-size:13.5px;color:var(--text-muted);"></div>
    </div>

    <!-- My challenges -->
    <div class="ss-card">
      <div style="font-weight:800;font-size:15px;color:var(--text);margin-bottom:10px;">My challenges</div>
      <div id="ch-my-list"><span style="font-size:13.5px;color:var(--text-muted);">Loading...</span></div>
    </div>
  </div>
</div>

<script>
function ssEscapeHtml(s){
  var div = document.createElement('div');
  div.textContent = String(s == null ? '' : s);
  return div.innerHTML;
}
function ssToggleTheme(){
  var isDark = document.documentElement.getAttribute('data-theme') === 'dark';
  if (isDark) {
    document.documentElement.removeAttribute('data-theme');
    try { localStorage.setItem('ss-theme', 'light'); } catch (e) {}
  } else {
    document.documentElement.setAttribute('data-theme', 'dark');
    try { localStorage.setItem('ss-theme', 'dark'); } catch (e) {}
  }
}

// Same {key, label} pairs as LB_SUBJECTS in public/leaderboards/index.html.
var CH_SUBJECTS = [
  {key:'geometry',label:'Geometry'},{key:'chemistry',label:'Chemistry'},{key:'algebra1',label:'Algebra I'},
  {key:'algebra2',label:'Algebra II'},{key:'aplang',label:'AP English Lang & Comp'},{key:'globalhistory',label:'Global History'},
  {key:'apbiology',label:'AP Biology'},{key:'apush',label:'APUSH'},{key:'us-history',label:'US History'},
  {key:'physics',label:'Physics'},{key:'biology',label:'Biology'},{key:'precalc',label:'PreCalculus'},
  {key:'act-prep',label:'ACT Prep'},{key:'anatomy',label:'Anatomy & Physiology'},{key:'ap-chemistry',label:'AP Chemistry'},
  {key:'ap-csa',label:'AP Computer Science A'},{key:'ap-euro',label:'AP European History'},{key:'ap-macro',label:'AP Macroeconomics'},
  {key:'ap-micro',label:'AP Microeconomics'},{key:'ap-physics',label:'AP Physics 1'},{key:'ap-psych',label:'AP Psychology'},
  {key:'ap-stats',label:'AP Statistics'},{key:'ap-usgov',label:'AP US Government'},{key:'ap-world',label:'AP World History'},
  {key:'ap-human-geography',label:'AP Human Geography'},{key:'art-history',label:'Art History'},{key:'astronomy',label:'Astronomy'},
  {key:'computer-science',label:'Computer Science'},{key:'creative-writing',label:'Creative Writing'},{key:'earth-science',label:'Earth Science'},
  {key:'economics',label:'Economics'},{key:'english-10',label:'English 10'},{key:'english-9',label:'English 9'},
  {key:'environmental-science',label:'Environmental Science'},{key:'french-1',label:'French 1'},{key:'geography',label:'Geography'},
  {key:'german-1',label:'German 1'},{key:'health',label:'Health'},{key:'journalism',label:'Journalism'},
  {key:'music-theory',label:'Music Theory'},{key:'psychology',label:'Psychology'},{key:'sat-math',label:'SAT Math Prep'},
  {key:'sat-reading',label:'SAT Reading & Writing'},{key:'sociology',label:'Sociology'},{key:'spanish-1',label:'Spanish 1'},
  {key:'spanish-2',label:'Spanish 2'},{key:'spanish-3',label:'Spanish 3'},{key:'speech-debate',label:'Speech & Debate'},
  {key:'statistics',label:'Statistics'},{key:'study-skills',label:'Study Skills'},{key:'us-government',label:'US Government'},
  {key:'world-history',label:'World History'},{key:'calculus',label:'Calculus'},{key:'calc-ab',label:'AP Calculus AB'},
  {key:'calc-bc',label:'AP Calculus BC'}
];
function chSubjectLabel(key){
  var s = CH_SUBJECTS.filter(function(x){ return x.key === key; })[0];
  return s ? s.label : key;
}

var chCode = null;       // code from ?challenge= in the URL, if any
var chQuiz = null;       // the real QUIZ array fetched from the subject page
var chQuestions = [];    // the subset of QUIZ this challenge uses
var chAnswers = [];      // student's picks, parallel to chQuestions

// Fetches a subject's live guide page and pulls its embedded QUIZ array out
// of the raw HTML -- the same "read embedded data out of a subject page's
// raw HTML with a plain scan" approach worker.ts's rewriteViewMeta() already
// uses for title/description. Quiz content itself never lives on the server;
// this always reads it live from the real, currently-published subject page.
async function chFetchQuiz(subjectKey){
  var res = await fetch('/' + subjectKey + '/');
  var html = await res.text();
  var m = /const QUIZ *= *(\[.*?\]);\s*(?:const|var|let|\n)/.exec(html) || /const QUIZ *= *(\[.*\]);/.exec(html);
  if (!m) throw new Error('Could not find quiz questions for this subject.');
  return JSON.parse(m[1]);
}

function chPopulateSubjects(){
  var sel = document.getElementById('ch-subject-select');
  sel.innerHTML = CH_SUBJECTS.map(function(s){ return '<option value="'+s.key+'">'+ssEscapeHtml(s.label)+'</option>'; }).join('');
}

async function chCreate(){
  var status = document.getElementById('ch-create-status');
  var btn = document.getElementById('ch-create-btn');
  var subjectKey = document.getElementById('ch-subject-select').value;
  var count = parseInt(document.getElementById('ch-count-select').value, 10);
  btn.disabled = true;
  status.textContent = 'Loading questions...';
  try {
    var quiz = await chFetchQuiz(subjectKey);
    if (!quiz.length) throw new Error('This subject has no quiz questions yet.');
    var indexes = quiz.map(function(_, i){ return i; });
    for (var i = indexes.length - 1; i > 0; i--) {
      var j = Math.floor(Math.random() * (i + 1));
      var t = indexes[i]; indexes[i] = indexes[j]; indexes[j] = t;
    }
    var picked = indexes.slice(0, Math.min(count, quiz.length));

    status.textContent = 'Creating challenge...';
    var res = await fetch('/api/challenge/create', {
      method: 'POST', headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ subjectKey: subjectKey, questionNumbers: picked })
    });
    var data = await res.json();
    if (!res.ok) { status.textContent = data.error || 'Could not create challenge.'; btn.disabled = false; return; }

    var link = location.origin + '/challenge?challenge=' + data.code;
    status.innerHTML = 'Share this with a friend:<br><br>'
      + '<div class="ch-code-box">' + ssEscapeHtml(data.code) + '</div>'
      + '<p style="font-size:13px;color:var(--text-muted);margin:10px 0 0;word-break:break-all;">' + ssEscapeHtml(link) + '</p>';
    btn.disabled = false;
    chLoadMyChallenges();
  } catch (e) {
    status.textContent = e.message || 'Something went wrong.';
    btn.disabled = false;
  }
}

function chScorePct(r){ return r.total ? Math.round((r.correct / r.total) * 100) : 0; }

function chRenderResult(data, myRole){
  var el = document.getElementById('ch-result-body');
  document.getElementById('ch-view-result').style.display = 'block';
  var mine = myRole === 'creator' ? data.creatorResult : data.opponentResult;
  var theirs = myRole === 'creator' ? data.opponentResult : data.creatorResult;
  var myName = myRole === 'creator' ? data.creatorHandle : (data.opponentHandle || 'Opponent');
  var theirName = myRole === 'creator' ? (data.opponentHandle || 'Opponent') : data.creatorHandle;

  if (!data.opponentHandle) {
    el.innerHTML = '<div style="font-weight:800;font-size:15px;">Waiting for an opponent to claim this challenge.</div>'
      + '<p style="font-size:13.5px;color:var(--text-muted);">Share the code above with a friend.</p>';
    return;
  }
  if (!mine) {
    el.innerHTML = '<div style="font-weight:800;font-size:15px;">Take the quiz above to see your head-to-head result.</div>';
    return;
  }
  if (!theirs) {
    el.innerHTML = '<div style="font-weight:800;font-size:15px;">You scored ' + mine.correct + '/' + mine.total + '.</div>'
      + '<p style="font-size:13.5px;color:var(--text-muted);">Waiting for ' + ssEscapeHtml(theirName) + ' to finish. Check back later -- refresh this page.</p>';
    return;
  }
  var myPct = chScorePct(mine), theirPct = chScorePct(theirs);
  var verdict = myPct > theirPct ? 'You won!' : myPct < theirPct ? 'They won this one.' : "It's a tie!";
  el.innerHTML = '<div style="font-weight:800;font-size:16px;margin-bottom:6px;">' + verdict + '</div>'
    + '<div class="ch-vs">'
    + '<div class="ch-vs-side"><div class="ch-vs-name">' + ssEscapeHtml(myName) + ' (you)</div><div class="ch-vs-score">' + mine.correct + '/' + mine.total + '</div><div class="ch-vs-pct">' + myPct + '%</div></div>'
    + '<div class="ch-vs-mid">vs</div>'
    + '<div class="ch-vs-side"><div class="ch-vs-name">' + ssEscapeHtml(theirName) + '</div><div class="ch-vs-score">' + theirs.correct + '/' + theirs.total + '</div><div class="ch-vs-pct">' + theirPct + '%</div></div>'
    + '</div>';
}

function chRenderQuizQuestion(idx){
  var body = document.getElementById('ch-quiz-body');
  var q = chQuestions[idx];
  var total = chQuestions.length;
  var optsHtml = q.o.map(function(opt, i){
    var picked = chAnswers[idx] === i;
    return '<button type="button" class="ch-opt' + (picked ? ' picked' : '') + '" onclick="chPick(' + idx + ',' + i + ')">' + ssEscapeHtml(opt) + '</button>';
  }).join('');
  var isLast = idx === total - 1;
  body.innerHTML = '<div style="font-size:12.5px;font-weight:700;color:var(--text-muted);margin-bottom:8px;">Question ' + (idx+1) + ' of ' + total + '</div>'
    + '<div class="ch-q"><div class="ch-q-text">' + ssEscapeHtml(q.q) + '</div>' + optsHtml + '</div>'
    + '<div style="display:flex;gap:8px;">'
    + (idx > 0 ? '<button class="ss-btn" onclick="chRenderQuizQuestion(' + (idx-1) + ')">Back</button>' : '')
    + (isLast
        ? '<button class="ss-btn ss-btn-solid" onclick="chFinishQuiz()">Submit</button>'
        : '<button class="ss-btn ss-btn-solid" onclick="chRenderQuizQuestion(' + (idx+1) + ')">Next</button>')
    + '</div>';
}
function chPick(qIdx, optIdx){
  chAnswers[qIdx] = optIdx;
  chRenderQuizQuestion(qIdx);
}

async function chFinishQuiz(){
  var correct = 0;
  for (var i = 0; i < chQuestions.length; i++) {
    if (chAnswers[i] === chQuestions[i].a) correct++;
  }
  document.getElementById('ch-quiz-body').innerHTML = '<div style="font-weight:800;">Submitting your result...</div>';
  try {
    var res = await fetch('/api/challenge/' + chCode + '/submit', {
      method: 'POST', headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ correct: correct, total: chQuestions.length })
    });
    var data = await res.json();
    document.getElementById('ch-view-quiz').style.display = 'none';
    if (!res.ok) {
      document.getElementById('ch-view-info').style.display = 'block';
      document.getElementById('ch-info-body').innerHTML = '<p style="color:var(--danger);">' + ssEscapeHtml(data.error || 'Could not submit your result.') + '</p>';
      return;
    }
    chLoadChallenge(chCode);
  } catch (e) {
    document.getElementById('ch-quiz-body').innerHTML = '<div style="color:var(--danger);">Something went wrong submitting your result.</div>';
  }
}

async function chStartQuiz(subjectKey, questionNumbers){
  document.getElementById('ch-view-quiz').style.display = 'block';
  document.getElementById('ch-quiz-body').innerHTML = 'Loading questions...';
  try {
    var quiz = await chFetchQuiz(subjectKey);
    chQuestions = questionNumbers.map(function(n){ return quiz[n]; }).filter(Boolean);
    if (!chQuestions.length) throw new Error('Could not load this challenge\'s questions.');
    chAnswers = [];
    chRenderQuizQuestion(0);
  } catch (e) {
    document.getElementById('ch-quiz-body').innerHTML = '<div style="color:var(--danger);">' + ssEscapeHtml(e.message || 'Something went wrong loading questions.') + '</div>';
  }
}

async function chLoadChallenge(code){
  chCode = code;
  document.getElementById('ch-view-create').style.display = 'none';
  document.getElementById('ch-view-info').style.display = 'block';
  document.getElementById('ch-info-body').innerHTML = 'Loading challenge...';
  try {
    var res = await fetch('/api/challenge/' + code);
    var data = await res.json();
    if (!res.ok) {
      document.getElementById('ch-info-body').innerHTML = '<p style="color:var(--danger);">' + ssEscapeHtml(data.error || 'Challenge not found.') + '</p>';
      return;
    }

    var subjectLabel = chSubjectLabel(data.subjectKey);
    var info = '<div style="font-weight:800;font-size:16px;margin-bottom:6px;">' + ssEscapeHtml(subjectLabel) + ' challenge</div>'
      + '<p style="font-size:13.5px;color:var(--text-muted);margin:0 0 14px;">From <strong>' + ssEscapeHtml(data.creatorHandle) + '</strong> -- ' + data.questionCount + ' questions.</p>';

    if (data.role === 'none') {
      info += '<button class="ss-btn ss-btn-solid" onclick="chClaim(\'' + code + '\')">Accept challenge</button>';
      document.getElementById('ch-info-body').innerHTML = info;
      return;
    }

    document.getElementById('ch-info-body').innerHTML = info;

    var myResult = data.role === 'creator' ? data.creatorResult : data.opponentResult;
    if (!myResult && data.claimed) {
      await chStartQuiz(data.subjectKey, data.questionNumbers);
    } else if (!myResult && !data.claimed) {
      // Creator waiting for someone to claim -- nothing to take yet.
    } else {
      document.getElementById('ch-view-quiz').style.display = 'none';
    }
    chRenderResult(data, data.role);
  } catch (e) {
    document.getElementById('ch-info-body').innerHTML = '<p style="color:var(--danger);">Something went wrong loading this challenge.</p>';
  }
}

async function chClaim(code){
  document.getElementById('ch-info-body').innerHTML = 'Joining...';
  try {
    var res = await fetch('/api/challenge/' + code + '/claim', { method: 'POST' });
    var data = await res.json();
    if (!res.ok) {
      document.getElementById('ch-info-body').innerHTML = '<p style="color:var(--danger);">' + ssEscapeHtml(data.error || 'Could not join this challenge.') + '</p>';
      return;
    }
    chLoadChallenge(code);
  } catch (e) {
    document.getElementById('ch-info-body').innerHTML = '<p style="color:var(--danger);">Something went wrong.</p>';
  }
}

async function chLoadMyChallenges(){
  var el = document.getElementById('ch-my-list');
  try {
    var res = await fetch('/api/challenges');
    var data = await res.json();
    if (!res.ok || !data.challenges.length) {
      el.innerHTML = '<span style="font-size:13.5px;color:var(--text-muted);">No challenges yet -- create one above.</span>';
      return;
    }
    el.innerHTML = data.challenges.map(function(c){
      var status = c.done ? 'Finished' : c.claimed ? 'In progress' : 'Waiting for opponent';
      return '<div class="ch-list-row">'
        + '<span>' + ssEscapeHtml(chSubjectLabel(c.subjectKey)) + ' <span style="color:var(--text-muted);">(' + c.role + ')</span></span>'
        + '<span class="ch-badge">' + status + '</span>'
        + '<a class="ss-btn" style="font-size:12px;padding:5px 12px;text-decoration:none;" href="/challenge?challenge=' + c.code + '">Open</a>'
        + '</div>';
    }).join('');
  } catch (e) {
    el.innerHTML = '<span style="font-size:13.5px;color:var(--text-muted);">Could not load your challenges.</span>';
  }
}

function chLoginBoxHtml(){
  return '<a class="ss-oauth-btn" href="/auth/google/start?next=' + encodeURIComponent(location.pathname + location.search) + '">Continue with Google</a>'
    + '<a class="ss-oauth-btn" href="/auth/github/start?next=' + encodeURIComponent(location.pathname + location.search) + '">Continue with GitHub</a>';
}

async function chInit(){
  chPopulateSubjects();
  var gate = document.getElementById('ch-gate');
  var me;
  try {
    var res = await fetch('/auth/me');
    me = await res.json();
  } catch (e) {
    me = { loggedIn: false };
  }
  if (!me.loggedIn) {
    gate.style.display = 'block';
    document.getElementById('ch-login-box').innerHTML = chLoginBoxHtml();
    return;
  }
  document.getElementById('ch-app').style.display = 'block';
  chLoadMyChallenges();

  var params = new URLSearchParams(location.search);
  var code = params.get('challenge');
  if (code) chLoadChallenge(code.toUpperCase());
}
chInit();
</script>
