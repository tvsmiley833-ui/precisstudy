<script>
(function(){
  try {
    var saved = localStorage.getItem('ss-theme');
    if (saved === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
  } catch (e) {}
})();
</script>
<style>
:root{
  --bg:#fffaf5; --bg-card:#fff; --bg-header:#ffffff;
  --border:#ffe4cc;
  --text:#3d2a1e; --text-body:#5c4433; --text-muted:#7d5c47; --nav-text:#7c4a2d;
  --accent:#c2410c; --accent-bright:#ff8a4c; --accent-hover:#f0722e;
  --badge-green:#22a06b;
  --chip-bg:#ffe4cc; --chip-text:#c2410c;
  --card-shadow:0 1px 3px rgba(61,42,30,.05),0 24px 48px -28px rgba(194,65,12,.18);
  --hero-glow:radial-gradient(ellipse at center, rgba(255,138,76,.16), rgba(255,138,76,0) 70%);
}
[data-theme="dark"]{
  --bg:#1b1512; --bg-card:#241d18; --bg-header:#211a16;
  --border:#3d3128;
  --text:#f3ece2; --text-body:#ddd0c2; --text-muted:#c9a688; --nav-text:#c9a688;
  --accent:#ff9d5c; --accent-bright:#ff8a4c; --accent-hover:#ffab72;
  --badge-green:#3ecf8e;
  --chip-bg:#3d3128; --chip-text:#ff9d5c;
  --card-shadow:0 1px 3px rgba(0,0,0,.3),0 24px 48px -28px rgba(0,0,0,.5);
  --hero-glow:radial-gradient(ellipse at center, rgba(255,138,76,.10), rgba(255,138,76,0) 70%);
}
#theme-toggle{background:none;border:1px solid var(--border);color:var(--text-muted);border-radius:999px;
  width:34px;height:34px;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0}
#theme-toggle:hover{border-color:var(--accent-bright);color:var(--accent)}
#theme-toggle svg{width:17px;height:17px}
#theme-toggle .icon-sun{display:none}
[data-theme="dark"] #theme-toggle .icon-moon{display:none}
[data-theme="dark"] #theme-toggle .icon-sun{display:block}

#ss-signin-btn{background:none;border:1px solid var(--border);color:var(--accent);font-weight:700;padding:8px 16px;
  border-radius:999px;cursor:pointer;font-family:inherit;font-size:15px;white-space:nowrap}
#ss-signin-btn:hover{background:var(--bg)}
#ss-login-panel{display:none;position:absolute;top:calc(100% + 10px);right:0;background:var(--bg-card);border:2px solid var(--border);
  border-radius:16px;padding:22px;width:280px;box-shadow:0 12px 32px rgba(0,0,0,.18);z-index:50;text-align:left}
#ss-login-panel.open{display:block}
.ss-oauth-btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;box-sizing:border-box;
  padding:10px 14px;border-radius:12px;border:2px solid var(--border);background:var(--bg-card);color:var(--text);
  font-family:inherit;font-size:14px;font-weight:700;cursor:pointer;text-decoration:none;margin-bottom:9px;transition:all .15s}
.ss-oauth-btn:hover{border-color:var(--accent-bright);background:var(--bg)}
.ss-status{font-size:12.5px;color:var(--text-muted);margin-top:9px;min-height:16px}
.ss-account{display:flex;align-items:center;gap:10px}
.ss-account-name{font-weight:700;color:var(--text);font-size:14px;white-space:nowrap}
.ss-account button{background:none;border:1px solid var(--border);border-radius:999px;color:var(--text-muted);padding:6px 12px;
  font-size:13px;cursor:pointer;font-family:inherit}
.ss-account button:hover{color:var(--accent);border-color:var(--accent-bright)}
@media(max-width:640px){#ss-signin-btn{padding:7px 12px;font-size:13px} .ss-account-name{display:none}}
@media(max-width:640px){
  .header-bar{padding:14px 16px}
  .nav-links{gap:10px}
  .nav-hide-sm{display:none}
  .nav-links > .ss-cta-btn{display:none}
}

html{scroll-behavior:smooth}
body{transition:background .2s ease,color .2s ease}

.ss-hero{position:relative;overflow:hidden}
.ss-hero::before{content:"";position:absolute;top:-160px;left:50%;transform:translateX(-50%);width:900px;height:460px;
  background:var(--hero-glow);pointer-events:none;z-index:0}
.ss-hero-inner{position:relative;z-index:1}

@keyframes ssFadeInUp{from{opacity:0;transform:translateY(14px)}to{opacity:1;transform:translateY(0)}}
.ss-hero-anim{opacity:0;animation:ssFadeInUp .6s cubic-bezier(.2,.8,.2,1) forwards}

.ss-cta-btn{transition:background .2s ease,transform .15s ease,box-shadow .2s ease}
.ss-cta-btn:hover{background:var(--accent-hover);transform:translateY(-1px);box-shadow:0 8px 20px rgba(194,65,12,.28)}

.ss-card{background:var(--bg-card);border:2px solid var(--border);border-radius:18px;padding:32px;
  box-shadow:var(--card-shadow)}

.ss-reveal{opacity:0;transform:translateY(18px);transition:opacity .6s ease,transform .6s ease}
.ss-reveal.in-view{opacity:1;transform:translateY(0)}

.rg-field{margin-bottom:18px}
.rg-field label{display:block;font-weight:700;font-size:14px;color:var(--text);margin-bottom:6px}
.rg-field .rg-hint{font-weight:500;color:var(--text-muted);font-size:12.5px;margin-left:6px}
.rg-field input,.rg-field textarea{
  width:100%;box-sizing:border-box;background:var(--bg);border:2px solid var(--border);border-radius:10px;
  padding:11px 14px;color:var(--text);font-size:15px;font-family:inherit;outline:none;resize:vertical;
  transition:border-color .2s ease,box-shadow .2s ease}
.rg-field input:focus,.rg-field textarea:focus{border-color:var(--accent-bright);box-shadow:0 0 0 4px rgba(255,138,76,.12)}
.rg-submit{background:var(--accent-bright);color:#fff;border:none;border-radius:999px;padding:12px 26px;font-weight:700;
  font-size:15px;font-family:inherit;cursor:pointer;transition:background .2s ease,transform .15s ease,box-shadow .2s ease}
.rg-submit:hover{background:var(--accent-hover);transform:translateY(-1px);box-shadow:0 8px 20px rgba(194,65,12,.28)}
.rg-submit:disabled{opacity:.6;cursor:default;transform:none;box-shadow:none}
.rg-status{margin-top:14px;font-size:14px;font-weight:600}
.rg-status.ok{color:var(--badge-green)}
.rg-status.err{color:var(--accent)}
.rg-file-btn{display:inline-flex;align-items:center;gap:8px;background:var(--bg);border:2px dashed var(--border);border-radius:10px;
  padding:11px 14px;color:var(--text-muted);font-size:14px;font-weight:600;cursor:pointer;transition:border-color .2s ease,color .2s ease;width:100%;box-sizing:border-box}
.rg-file-btn:hover{border-color:var(--accent-bright);color:var(--accent)}
.rg-field input[type="file"]{display:none}
.rg-files-list{margin-top:8px;display:flex;flex-direction:column;gap:4px}
.rg-file-chip{display:flex;align-items:center;justify-content:space-between;gap:10px;background:var(--bg);border:1px solid var(--border);
  border-radius:8px;padding:6px 10px;font-size:13px;color:var(--text-body)}
.rg-file-chip button{background:none;border:none;color:var(--text-muted);cursor:pointer;font-size:15px;line-height:1;padding:0 2px}
.rg-file-chip button:hover{color:var(--accent)}
</style>
</head>
<body style="margin:0;font-family:'Nunito','Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--text);">

<div class="header-bar" style="display:flex;align-items:center;justify-content:space-between;padding:18px 32px;background:var(--bg-header);border-bottom:1px solid var(--border);">
  <a href="/" style="font-weight:800;font-size:22px;color:var(--accent);display:flex;align-items:center;gap:8px;text-decoration:none;">
    <img src="/logo-icon.png" alt="" width="28" height="28" style="border-radius:6px;"/> StudyStacks
  </a>
  <div class="nav-links" style="display:flex;gap:16px;font-weight:600;font-size:15px;color:var(--nav-text);align-items:center;">
    <a href="/#classes-section" class="nav-hide-sm" style="color:var(--nav-text);text-decoration:none;">Browse Subjects</a>
    <a href="/#how-it-works" class="nav-hide-sm" style="color:var(--nav-text);text-decoration:none;">How It Works</a>
    <a href="/about" class="nav-hide-sm" style="color:var(--nav-text);text-decoration:none;">Who Are We</a>
    <a href="/request" class="nav-hide-sm" style="color:var(--accent);text-decoration:none;">Request a Guide</a>
    <a href="/dashboard" class="nav-hide-sm" style="color:var(--nav-text);text-decoration:none;">Dashboard</a>
    <button id="theme-toggle" onclick="ssToggleTheme()" aria-label="Toggle dark mode" title="Toggle dark mode">
      <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
      <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
    </button>
    <div id="ss-account-area" style="position:relative;"></div>
    <a href="/geometry" class="ss-cta-btn" style="background:var(--accent-bright);color:#fff;padding:8px 18px;border-radius:999px;text-decoration:none;white-space:nowrap;">Start with Geometry →</a>
  </div>
</div>

<div class="ss-hero" style="text-align:center;padding:64px 32px 40px;">
  <div class="ss-hero-inner">
    <div class="ss-hero-anim" style="animation-delay:0s;display:inline-block;background:var(--chip-bg);color:var(--chip-text);font-weight:700;font-size:13px;padding:6px 14px;border-radius:999px;margin-bottom:18px;">
      Don't see your class?
    </div>
    <h1 class="ss-hero-anim" style="animation-delay:.08s;font-size:40px;font-weight:800;color:var(--text);margin:0 0 14px;letter-spacing:-0.02em;">
      Request a study guide.
    </h1>
    <p class="ss-hero-anim" style="animation-delay:.16s;font-size:17px;color:var(--text-muted);max-width:520px;margin:0 auto;line-height:1.5;">
      Tell us what class or subject you need, and we'll consider it for a future guide.
    </p>

</div>

<div class="ss-reveal" style="padding:0 32px 64px;">
  <div class="ss-card" style="max-width:560px;margin:0 auto;">
    <form id="rg-form">
      <div class="rg-field">
        <label for="rg-class">Class or subject <span class="rg-hint">required</span></label>
        <input id="rg-class" type="text" placeholder="e.g. AP Biology, Algebra 1, US History" maxlength="120" required/>
      </div>
      <div class="rg-field">
        <label for="rg-notes">Anything specific you'd like covered? <span class="rg-hint">optional</span></label>
        <textarea id="rg-notes" rows="4" maxlength="1000" placeholder="Exam board, topics, anything that'd help"></textarea>
      </div>
      <div class="rg-field">
        <label for="rg-email">Your email <span class="rg-hint">optional — only if you want updates</span></label>
        <input id="rg-email" type="email" placeholder="you@email.com" maxlength="254"/>
      </div>
      <div class="rg-field">
        <label for="rg-files">Attach materials <span class="rg-hint">optional — notes, past exams, syllabus</span></label>
        <label class="rg-file-btn" for="rg-files"><svg viewBox="0 0 24 24" width="15" height="15" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" style="vertical-align:-2px;margin-right:6px"><path d="M21.44 11.05l-9.19 9.19a6 6 0 0 1-8.49-8.49l9.19-9.19a4 4 0 0 1 5.66 5.66l-9.2 9.19a2 2 0 0 1-2.83-2.83l8.49-8.48"/></svg>Choose files (PDF, DOC, image, or TXT — up to 3 files, 6MB each)</label>
        <input id="rg-files" type="file" multiple accept=".pdf,.doc,.docx,.txt,.png,.jpg,.jpeg,.webp"/>
        <div class="rg-files-list" id="rg-files-list"></div>
      </div>
      <button type="submit" class="rg-submit" id="rg-submit-btn">Send request</button>
      <div class="rg-status" id="rg-status"></div>
    </form>
  </div>
</div>

<div style="border-top:1px solid var(--border);padding:24px 32px;text-align:center;">
  <a href="/privacy" style="color:var(--text-muted);font-size:13px;text-decoration:none;margin-right:14px;">Privacy</a>
  <a href="/terms" style="color:var(--text-muted);font-size:13px;text-decoration:none;margin-right:14px;">Terms</a>
  <a href="#" class="ss-mail-link" data-u="studystackssupport" data-d="gmail.com" style="color:var(--text-muted);font-size:13px;text-decoration:none;">
    Questions or feedback? <span class="ss-mail-addr"></span>
  </a>

<script>
document.querySelectorAll('.ss-mail-link').forEach(function(el){
  var addr = el.dataset.u + '@' + el.dataset.d;
  el.href = 'mailto:' + addr;
  var span = el.querySelector('.ss-mail-addr');
  if (span) span.textContent = addr;
});

function ssToggleTheme(){
  var isDark = document.documentElement.getAttribute('data-theme') === 'dark';
  if (isDark) {
    document.documentElement.removeAttribute('data-theme');
    try { localStorage.setItem('ss-theme', 'light'); } catch (e) {}
  } else {
    document.documentElement.setAttribute('data-theme', 'dark');
    try { localStorage.setItem('ss-theme', 'dark'); } catch (e) {}
  }
}
</script>

<script>
var RG_MAX_FILES = 3, RG_MAX_FILE_SIZE = 6*1024*1024, RG_MAX_TOTAL = 15*1024*1024;

function rgFormatBytes(n){
  if(n < 1024) return n + ' B';
  if(n < 1024*1024) return Math.round(n/1024) + ' KB';
  return (n/(1024*1024)).toFixed(1) + ' MB';
}

function rgSyncFilesInput(){
  var input = document.getElementById('rg-files');
  var dt = new DataTransfer();
  RG_SELECTED_FILES.forEach(function(f){ dt.items.add(f); });
  input.files = dt.files;
}

function rgRenderFileList(){
  var list = document.getElementById('rg-files-list');
  list.innerHTML = RG_SELECTED_FILES.map(function(f, i){
    return '<div class="rg-file-chip"><span>' + ssEscapeHtml(f.name) + ' (' + rgFormatBytes(f.size) + ')</span>'
      + '<button type="button" onclick="rgRemoveFile(' + i + ')" aria-label="Remove file">✕</button></div>';
  }).join('');
}

function rgRemoveFile(i){
  RG_SELECTED_FILES.splice(i, 1);
  rgSyncFilesInput();
  rgRenderFileList();
}

var RG_SELECTED_FILES = [];

document.getElementById('rg-files').addEventListener('change', function(){
  var status = document.getElementById('rg-status');
  status.textContent = '';
  status.className = 'rg-status';
  var incoming = Array.prototype.slice.call(this.files);
  var combined = RG_SELECTED_FILES.concat(incoming);
  if(combined.length > RG_MAX_FILES){
    status.textContent = 'You can attach at most ' + RG_MAX_FILES + ' files.';
    status.className = 'rg-status err';
    combined = combined.slice(0, RG_MAX_FILES);
  }
  RG_SELECTED_FILES = combined;
  rgSyncFilesInput();
  rgRenderFileList();
});

document.getElementById('rg-form').addEventListener('submit', async function(e){
  e.preventDefault();
  var btn = document.getElementById('rg-submit-btn');
  var status = document.getElementById('rg-status');
  var className = document.getElementById('rg-class').value.trim();
  var notes = document.getElementById('rg-notes').value.trim();
  var email = document.getElementById('rg-email').value.trim();

  status.textContent = '';
  status.className = 'rg-status';

  var totalSize = RG_SELECTED_FILES.reduce(function(sum, f){ return sum + f.size; }, 0);
  var oversized = RG_SELECTED_FILES.find(function(f){ return f.size > RG_MAX_FILE_SIZE; });
  if(oversized){
    status.textContent = oversized.name + ' is too large (max 6MB per file).';
    status.className = 'rg-status err';
    return;
  }
  if(totalSize > RG_MAX_TOTAL){
    status.textContent = 'Attachments are too large — 15MB total max.';
    status.className = 'rg-status err';
    return;
  }

  btn.disabled = true;
  var originalText = btn.textContent;
  btn.textContent = 'Sending…';

  try{
    var fd = new FormData();
    fd.append('className', className);
    fd.append('notes', notes);
    fd.append('email', email);
    RG_SELECTED_FILES.forEach(function(f){ fd.append('files', f); });

    var res = await fetch('/api/request-guide', { method: 'POST', body: fd });
    var data = await res.json();
    if(res.ok){
      status.textContent = "Thanks! We've got your request.";
      status.className = 'rg-status ok';
      document.getElementById('rg-form').reset();
      RG_SELECTED_FILES = [];
      rgRenderFileList();
    }else{
      status.textContent = data.error || 'Something went wrong — try again.';
      status.className = 'rg-status err';
    }
  }catch(err){
    status.textContent = 'Network error — try again.';
    status.className = 'rg-status err';
  }
  btn.disabled = false;
  btn.textContent = originalText;
});

function ssLoginBoxHtml(){
  return '<a class="ss-oauth-btn" href="/auth/google/start">Continue with Google</a>'
    + '<a class="ss-oauth-btn" href="/auth/github/start">Continue with GitHub</a>'
    + '<div class="ss-status"></div>';
}

function ssToggleLoginPanel(){
  var panel = document.getElementById('ss-login-panel');
  if(!panel) return;
  var opening = !panel.classList.contains('open');
  panel.classList.toggle('open', opening);
  if(opening) panel.querySelector('.ss-login-box').innerHTML = ssLoginBoxHtml();
}

async function ssLogout(){
  try{ await fetch('/auth/logout', {method:'POST'}); }catch(e){}
  SS_SESSION = false;
  ssRenderAccountUI();
}

function ssEscapeHtml(s){
  var div = document.createElement('div');
  div.textContent = String(s == null ? '' : s);
  return div.innerHTML;
}

let SS_SESSION;

function ssRenderAccountUI(){
  var area = document.getElementById('ss-account-area');
  if(!area) return;
  if(SS_SESSION){
    area.innerHTML = '<div class="ss-account"><span class="ss-account-name">' + ssEscapeHtml(SS_SESSION.name) + '</span>'
      + '<button onclick="ssLogout()">Sign out</button></div>';
  }else{
    area.innerHTML = '<button id="ss-signin-btn" onclick="ssToggleLoginPanel()">Sign In</button>'
      + '<div id="ss-login-panel"><div class="ss-login-box"></div></div>';
  }
}

async function ssCheckSession(){
  try{
    var res = await fetch('/auth/me');
    var data = await res.json();
    SS_SESSION = data.loggedIn ? data : false;
  }catch(e){
    SS_SESSION = false;
  }
  ssRenderAccountUI();
  return SS_SESSION;
}

document.addEventListener('click', function(e){
  var panel = document.getElementById('ss-login-panel');
  var area = document.getElementById('ss-account-area');
  if(panel && panel.classList.contains('open') && area && !area.contains(e.target)){
    panel.classList.remove('open');
  }
});

ssCheckSession();

if ('IntersectionObserver' in window) {
  var ssRevealObserver = new IntersectionObserver(function(entries) {
    entries.forEach(function(entry) {
      if (entry.isIntersecting) {
        entry.target.classList.add('in-view');
        ssRevealObserver.unobserve(entry.target);
      }
    });
  }, { threshold: 0.12 });
  document.querySelectorAll('.ss-reveal').forEach(function(el) { ssRevealObserver.observe(el); });
} else {
  document.querySelectorAll('.ss-reveal').forEach(function(el) { el.classList.add('in-view'); });
}
</script>
