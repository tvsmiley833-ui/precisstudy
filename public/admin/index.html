<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Dashboard — StudyStacks</title>
<link rel="icon" type="image/png" href="/favicon.png"/>
<link rel="apple-touch-icon" href="/apple-touch-icon.png"/>
<style>
#ss-signin-btn{background:none;border:1px solid #ffe4cc;color:#c2410c;font-weight:700;padding:8px 16px;
  border-radius:999px;cursor:pointer;font-family:inherit;font-size:15px;white-space:nowrap}
#ss-signin-btn:hover{background:#fff5eb}
#ss-login-panel{display:none;position:absolute;top:calc(100% + 10px);right:0;background:#fff;border:2px solid #ffe4cc;
  border-radius:16px;padding:22px;width:280px;box-shadow:0 12px 32px rgba(194,65,12,.15);z-index:50;text-align:left}
#ss-login-panel.open{display:block}
.ss-oauth-btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;box-sizing:border-box;
  padding:10px 14px;border-radius:12px;border:2px solid #ffe4cc;background:#fff;color:#3d2a1e;
  font-family:inherit;font-size:14px;font-weight:700;cursor:pointer;text-decoration:none;margin-bottom:9px;transition:all .15s}
.ss-oauth-btn:hover{border-color:#ff8a4c;background:#fff5eb}
.ss-status{font-size:12.5px;color:#7d5c47;margin-top:9px;min-height:16px}
.ss-account{display:flex;align-items:center;gap:10px}
.ss-account-name{font-weight:700;color:#3d2a1e;font-size:14px;white-space:nowrap}
.ss-account button{background:none;border:1px solid #ffe4cc;border-radius:999px;color:#7d5c47;padding:6px 12px;
  font-size:13px;cursor:pointer;font-family:inherit}
.ss-account button:hover{color:#c2410c;border-color:#ff8a4c}
@media(max-width:640px){#ss-signin-btn{padding:7px 12px;font-size:13px} .ss-account-name{display:none}}

html{scroll-behavior:smooth}

.ss-card{background:#fff;border:2px solid #ffe4cc;border-radius:18px;padding:28px;
  box-shadow:0 1px 3px rgba(61,42,30,.05),0 24px 48px -28px rgba(194,65,12,.18)}

.ss-cta-btn{transition:background .2s ease,transform .15s ease,box-shadow .2s ease}
.ss-cta-btn:hover{background:#f0722e;transform:translateY(-1px);box-shadow:0 8px 20px rgba(194,65,12,.28)}

.req-row{border:2px solid #ffe4cc;border-radius:14px;padding:18px 20px;margin-bottom:12px;background:#fffaf5;
  transition:border-color .2s ease,box-shadow .2s ease}
.req-row:hover{border-color:#ff8a4c;box-shadow:0 8px 20px rgba(194,65,12,.08)}
.req-class{font-weight:800;font-size:16px;color:#3d2a1e}
.req-meta{font-size:12.5px;color:#7d5c47;margin-top:2px}
.req-notes{font-size:14px;color:#5c4432;margin-top:10px;line-height:1.5;white-space:pre-wrap}
.req-email{font-size:13px;color:#c2410c;font-weight:700;margin-top:8px}
.req-delete{background:none;border:1px solid #ffe4cc;border-radius:999px;color:#7d5c47;padding:6px 14px;
  font-size:12.5px;cursor:pointer;font-family:inherit;transition:all .15s}
.req-delete:hover{color:#fff;background:#c2410c;border-color:#c2410c}

.stat-card{background:#fffaf5;border:2px solid #ffe4cc;border-radius:14px;padding:16px 18px;}
.stat-num{font-size:26px;font-weight:800;color:#3d2a1e;line-height:1.1;}
.stat-label{font-size:12.5px;color:#7d5c47;font-weight:700;text-transform:uppercase;letter-spacing:0.04em;margin-top:4px;}
</style>
</head>
<body style="margin:0;font-family:'Nunito','Segoe UI',system-ui,sans-serif;background:#fffaf5;">

<div class="header-bar" style="display:flex;align-items:center;justify-content:space-between;padding:18px 32px;background:#ffffff;border-bottom:1px solid #ffe4cc;">
  <a href="/" style="font-weight:800;font-size:22px;color:#c2410c;display:flex;align-items:center;gap:8px;text-decoration:none;">
    <img src="/logo-icon.png" alt="" width="28" height="28" style="border-radius:6px;"/> StudyStacks
  </a>
  <div class="nav-links" style="display:flex;gap:16px;font-weight:600;font-size:15px;color:#7c4a2d;align-items:center;">
    <div id="ss-account-area" style="position:relative;"></div>
    <a href="/" class="ss-cta-btn" style="background:#ff8a4c;color:#fff;padding:8px 18px;border-radius:999px;text-decoration:none;white-space:nowrap;">Back to Site</a>
  </div>
</div>

<div style="max-width:760px;margin:0 auto;padding:48px 32px 80px;">
  <h1 style="font-size:28px;font-weight:800;color:#3d2a1e;margin:0 0 6px;">Dashboard</h1>
  <p id="dash-subtitle" style="font-size:15px;color:#8a6650;margin:0 0 28px;">Loading…</p>

  <div id="dash-gate" style="display:none;">
    <div class="ss-card" style="text-align:center;">
      <p id="dash-gate-msg" style="font-size:16px;color:#3d2a1e;margin:0 0 16px;"></p>
      <button id="dash-signin-btn" class="ss-oauth-btn" style="width:auto;display:none;padding:10px 24px;">Sign in with Google</button>
    </div>
  </div>

  <div id="dash-content" style="display:none;">
    <div style="font-weight:700;font-size:14px;color:#c2410c;text-transform:uppercase;letter-spacing:0.06em;margin-bottom:14px;">
      Site Stats
    </div>
    <div id="stats-grid" style="display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:12px;margin-bottom:28px;"></div>
    <p id="stats-note" style="font-size:12.5px;color:#8a6650;margin:-18px 0 28px;display:none;"></p>

    <div style="font-weight:700;font-size:14px;color:#c2410c;text-transform:uppercase;letter-spacing:0.06em;margin-bottom:14px;">
      Guide Requests <span id="req-count"></span>
    </div>
    <div id="req-list"></div>
    <div id="req-empty" style="display:none;color:#7d5c47;font-size:14px;">No requests yet.</div>
  </div>
</div>

<script>
function ssEscapeHtml(s){
  var div = document.createElement('div');
  div.textContent = String(s == null ? '' : s);
  return div.innerHTML;
}

let SS_SESSION;

function ssLoginBoxHtml(){
  return '<a class="ss-oauth-btn" href="/auth/google/start">Continue with Google</a>'
    + '<a class="ss-oauth-btn" href="/auth/github/start">Continue with GitHub</a>'
    + '<div class="ss-status"></div>';
}

function ssToggleLoginPanel(){
  var panel = document.getElementById('ss-login-panel');
  if(!panel) return;
  var opening = !panel.classList.contains('open');
  panel.classList.toggle('open', opening);
  if(opening) panel.querySelector('.ss-login-box').innerHTML = ssLoginBoxHtml();
}

async function ssLogout(){
  try{ await fetch('/auth/logout', {method:'POST'}); }catch(e){}
  SS_SESSION = false;
  ssRenderAccountUI();
}

function ssRenderAccountUI(){
  var area = document.getElementById('ss-account-area');
  if(!area) return;
  if(SS_SESSION){
    area.innerHTML = '<div class="ss-account"><span class="ss-account-name">' + ssEscapeHtml(SS_SESSION.name) + '</span>'
      + '<button onclick="ssLogout()">Sign out</button></div>';
  }else{
    area.innerHTML = '<button id="ss-signin-btn" onclick="ssToggleLoginPanel()">Sign In</button>'
      + '<div id="ss-login-panel"><div class="ss-login-box"></div></div>';
  }
}

async function ssCheckSession(){
  try{
    var res = await fetch('/auth/me');
    var data = await res.json();
    SS_SESSION = data.loggedIn ? data : false;
  }catch(e){
    SS_SESSION = false;
  }
  ssRenderAccountUI();
  return SS_SESSION;
}

document.addEventListener('click', function(e){
  var panel = document.getElementById('ss-login-panel');
  var area = document.getElementById('ss-account-area');
  if(panel && panel.classList.contains('open') && area && !area.contains(e.target)){
    panel.classList.remove('open');
  }
});

function formatDate(iso){
  try{
    var d = new Date(iso);
    return d.toLocaleString();
  }catch(e){
    return iso;
  }
}

function renderRequests(requests){
  var list = document.getElementById('req-list');
  var empty = document.getElementById('req-empty');
  var count = document.getElementById('req-count');
  count.textContent = '(' + requests.length + ')';
  if(!requests.length){
    list.innerHTML = '';
    empty.style.display = 'block';
    return;
  }
  empty.style.display = 'none';
  list.innerHTML = requests.map(function(r){
    return '<div class="req-row" data-key="' + ssEscapeHtml(r.key) + '">'
      + '<div style="display:flex;justify-content:space-between;align-items:flex-start;gap:12px;">'
      + '<div><div class="req-class">' + ssEscapeHtml(r.className) + '</div>'
      + '<div class="req-meta">' + formatDate(r.submittedAt) + '</div></div>'
      + '<button class="req-delete" onclick="deleteRequest(\'' + encodeURIComponent(r.key) + '\')">Delete</button>'
      + '</div>'
      + (r.notes ? '<div class="req-notes">' + ssEscapeHtml(r.notes) + '</div>' : '')
      + (r.email ? '<div class="req-email">' + ssEscapeHtml(r.email) + '</div>' : '')
      + '</div>';
  }).join('');
}

function renderStats(stats){
  var grid = document.getElementById('stats-grid');
  var note = document.getElementById('stats-note');
  var logins = stats.logins || {};
  var humans = stats.humansByProvider || {};
  var cards = [
    { label: 'Humans Logged In', num: stats.totalHumans || 0 },
    { label: 'Google Logins', num: logins.google || 0 },
    { label: 'GitHub Logins', num: logins.github || 0 },
    { label: 'Email Logins', num: logins.email || 0 }
  ];
  grid.innerHTML = cards.map(function(c){
    return '<div class="stat-card"><div class="stat-num">' + c.num + '</div><div class="stat-label">' + c.label + '</div></div>';
  }).join('');
  note.style.display = 'block';
  note.textContent = 'Google: ' + (humans.google || 0) + ' people · GitHub: ' + (humans.github || 0) + ' people · Email: ' + (humans.email || 0) + ' people. Counting starts from when this tracking shipped — logins before that aren\'t included.';
}

async function loadStats(){
  var res = await fetch('/api/admin/stats');
  if(!res.ok) throw new Error('Failed to load stats');
  var data = await res.json();
  renderStats(data);
}

async function loadRequests(){
  var res = await fetch('/api/admin/guide-requests');
  if(!res.ok) throw new Error('Failed to load requests');
  var data = await res.json();
  renderRequests(data.requests || []);
}

async function deleteRequest(encodedKey){
  var row = document.querySelector('.req-row[data-key="' + decodeURIComponent(encodedKey) + '"]');
  if(row) row.style.opacity = '0.5';
  try{
    await fetch('/api/admin/guide-requests?key=' + encodedKey, { method: 'DELETE' });
    await loadRequests();
  }catch(e){
    if(row) row.style.opacity = '1';
  }
}

async function initDashboard(){
  var subtitle = document.getElementById('dash-subtitle');
  var gate = document.getElementById('dash-gate');
  var gateMsg = document.getElementById('dash-gate-msg');
  var signinBtn = document.getElementById('dash-signin-btn');
  var content = document.getElementById('dash-content');

  await ssCheckSession();

  var meRes = await fetch('/api/admin/me');
  var me = await meRes.json();

  if(!me.loggedIn){
    subtitle.textContent = 'Sign in to view guide requests.';
    gate.style.display = 'block';
    gateMsg.textContent = "You need to sign in to view this dashboard.";
    signinBtn.style.display = 'inline-flex';
    signinBtn.onclick = function(){ window.location.href = '/auth/google/start'; };
    return;
  }

  if(!me.isAdmin){
    subtitle.textContent = '';
    gate.style.display = 'block';
    gateMsg.textContent = "You're signed in, but this account doesn't have dashboard access.";
    return;
  }

  subtitle.textContent = 'Study guide requests from visitors.';
  content.style.display = 'block';
  try{
    await loadStats();
  }catch(e){
    document.getElementById('stats-grid').innerHTML = '';
  }
  try{
    await loadRequests();
  }catch(e){
    document.getElementById('req-list').innerHTML = '';
    var empty = document.getElementById('req-empty');
    empty.textContent = "Couldn't load requests — try refreshing.";
    empty.style.display = 'block';
  }
}

initDashboard();
</script>
</body>
</html>
