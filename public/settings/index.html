<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Settings — StudyStacks</title>
<meta name="robots" content="noindex"/>
<link rel="icon" type="image/png" href="/favicon.png"/>
<link rel="apple-touch-icon" href="/apple-touch-icon.png"/>
<script>
(function(){
  try {
    var saved = localStorage.getItem('ss-theme');
    if (saved === 'dark') document.documentElement.setAttribute('data-theme', 'dark');
  } catch (e) {}
})();
</script>
<style>
:root{
  --bg:#fffaf5; --bg-card:#fff; --bg-header:#ffffff;
  --border:#ffe4cc;
  --text:#3d2a1e; --text-body:#5c4433; --text-muted:#7d5c47; --nav-text:#7c4a2d;
  --accent:#c2410c; --accent-bright:#ff8a4c; --accent-hover:#f0722e;
  --card-shadow:0 1px 3px rgba(61,42,30,.05),0 24px 48px -28px rgba(194,65,12,.18);
}
[data-theme="dark"]{
  --bg:#1b1512; --bg-card:#241d18; --bg-header:#211a16;
  --border:#3d3128;
  --text:#f3ece2; --text-body:#ddd0c2; --text-muted:#c9a688; --nav-text:#c9a688;
  --accent:#ff9d5c; --accent-bright:#ff8a4c; --accent-hover:#ffab72;
  --card-shadow:0 1px 3px rgba(0,0,0,.3),0 24px 48px -28px rgba(0,0,0,.5);
}
#theme-toggle{background:none;border:1px solid var(--border);color:var(--text-muted);border-radius:999px;
  width:34px;height:34px;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0}
#theme-toggle:hover{border-color:var(--accent-bright);color:var(--accent)}
#theme-toggle svg{width:17px;height:17px}
#theme-toggle .icon-sun{display:none}
[data-theme="dark"] #theme-toggle .icon-moon{display:none}
[data-theme="dark"] #theme-toggle .icon-sun{display:block}

#ss-signin-btn{background:none;border:1px solid var(--border);color:var(--accent);font-weight:700;padding:8px 16px;
  border-radius:999px;cursor:pointer;font-family:inherit;font-size:15px;white-space:nowrap}
#ss-signin-btn:hover{background:var(--bg)}
#ss-login-panel{display:none;position:absolute;top:calc(100% + 10px);right:0;background:var(--bg-card);border:2px solid var(--border);
  border-radius:16px;padding:22px;width:280px;box-shadow:0 12px 32px rgba(0,0,0,.18);z-index:50;text-align:left}
#ss-login-panel.open{display:block}
.ss-oauth-btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;box-sizing:border-box;
  padding:10px 14px;border-radius:12px;border:2px solid var(--border);background:var(--bg-card);color:var(--text);
  font-family:inherit;font-size:14px;font-weight:700;cursor:pointer;text-decoration:none;margin-bottom:9px;transition:all .15s}
.ss-oauth-btn:hover{border-color:var(--accent-bright);background:var(--bg)}
.ss-status{font-size:12.5px;color:var(--text-muted);margin-top:9px;min-height:16px}
.ss-account{display:flex;align-items:center;gap:10px}
.ss-account-name{font-weight:700;color:var(--text);font-size:14px;white-space:nowrap}
.ss-account button{background:none;border:1px solid var(--border);border-radius:999px;color:var(--text-muted);padding:6px 12px;
  font-size:13px;cursor:pointer;font-family:inherit}
.ss-account button:hover{color:var(--accent);border-color:var(--accent-bright)}
.ss-logo-light{display:inline}
.ss-logo-dark{display:none}
[data-theme="dark"] .ss-logo-light{display:none!important}
[data-theme="dark"] .ss-logo-dark{display:inline!important}
@media(max-width:640px){
  #ss-signin-btn{padding:7px 12px;font-size:13px}
  .ss-account-name{display:none}
  .header-bar{padding:14px 16px!important}
  .nav-links{gap:10px!important}
  .nav-links > .ss-cta-btn{display:none}
}

html{scroll-behavior:smooth}

.ss-card{background:var(--bg-card);border:2px solid var(--border);border-radius:18px;padding:28px;
  box-shadow:var(--card-shadow)}

.ss-cta-btn{transition:background .2s ease,transform .15s ease,box-shadow .2s ease}
.ss-cta-btn:hover{background:var(--accent-hover);transform:translateY(-1px);box-shadow:0 8px 20px rgba(194,65,12,.28)}

.class-row{display:flex;align-items:center;gap:14px;border:2px solid var(--border);border-radius:14px;padding:14px 18px;margin-bottom:10px;
  cursor:pointer;transition:border-color .15s ease,background .15s ease}
.class-row:hover{border-color:var(--accent-bright)}
.class-row.checked{border-color:var(--accent-bright);background:color-mix(in srgb, var(--accent-bright) 8%, transparent)}
.class-row input[type="checkbox"]{width:20px;height:20px;accent-color:var(--accent-bright);flex-shrink:0;cursor:pointer}
.class-row .swatch{width:10px;height:32px;border-radius:4px;flex-shrink:0}
.class-row .name{font-weight:700;font-size:16px;color:var(--text)}

#settings-save-btn{background:var(--accent-bright);color:#fff;border:none;border-radius:999px;padding:12px 26px;font-weight:700;
  font-size:15px;font-family:inherit;cursor:pointer;transition:background .2s ease,transform .15s ease,box-shadow .2s ease}
#settings-save-btn:hover{background:var(--accent-hover);transform:translateY(-1px);box-shadow:0 8px 20px rgba(194,65,12,.28)}
#settings-save-btn:disabled{opacity:.6;cursor:default;transform:none;box-shadow:none}
#settings-status{margin-top:14px;font-size:14px;font-weight:600}
#settings-status.ok{color:#22a06b}
#settings-status.err{color:var(--accent)}
</style>
</head>
<body style="margin:0;font-family:'Nunito','Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--text);">

<div class="header-bar" style="display:flex;align-items:center;justify-content:space-between;padding:18px 32px;background:var(--bg-header);border-bottom:1px solid var(--border);">
  <a href="/" style="font-weight:800;font-size:22px;color:var(--accent);display:flex;align-items:center;gap:8px;text-decoration:none;">
    <span style="display:inline-block;width:28px;height:28px;position:relative;flex-shrink:0;">
      <img src="/logo-icon.png" alt="" width="28" height="28" style="border-radius:6px;position:absolute;inset:0;" class="ss-logo-light"/>
      <img src="/logo-icon-dark.png" alt="" width="28" height="28" style="border-radius:6px;position:absolute;inset:0;" class="ss-logo-dark"/>
    </span> StudyStacks
  </a>
  <div class="nav-links" style="display:flex;gap:16px;font-weight:600;font-size:15px;color:var(--nav-text);align-items:center;">
    <a href="/#classes-section" class="nav-hide-sm" style="color:var(--nav-text);text-decoration:none;">Browse Subjects</a>
    <a href="/request" class="nav-hide-sm" style="color:var(--nav-text);text-decoration:none;">Request a Guide</a>
    <a href="/dashboard" class="nav-hide-sm" style="color:var(--nav-text);text-decoration:none;">Dashboard</a>
    <a href="/settings" class="nav-hide-sm" style="color:var(--accent);text-decoration:none;">Settings</a>
    <button id="theme-toggle" onclick="ssToggleTheme()" aria-label="Toggle dark mode" title="Toggle dark mode">
      <svg class="icon-moon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M21 12.79A9 9 0 1 1 11.21 3 7 7 0 0 0 21 12.79z"/></svg>
      <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="4"/><line x1="12" y1="1" x2="12" y2="3"/><line x1="12" y1="21" x2="12" y2="23"/><line x1="4.22" y1="4.22" x2="5.64" y2="5.64"/><line x1="18.36" y1="18.36" x2="19.78" y2="19.78"/><line x1="1" y1="12" x2="3" y2="12"/><line x1="21" y1="12" x2="23" y2="12"/><line x1="4.22" y1="19.78" x2="5.64" y2="18.36"/><line x1="18.36" y1="5.64" x2="19.78" y2="4.22"/></svg>
    </button>
    <div id="ss-account-area" style="position:relative;"></div>
    <a href="/" class="ss-cta-btn" style="background:var(--accent-bright);color:#fff;padding:8px 18px;border-radius:999px;text-decoration:none;white-space:nowrap;">Back to Site</a>
  </div>
</div>

<div style="max-width:640px;margin:0 auto;padding:48px 32px 80px;">
  <h1 style="font-size:28px;font-weight:800;color:var(--text);margin:0 0 6px;">Settings</h1>
  <p id="settings-subtitle" style="font-size:15px;color:var(--text-muted);margin:0 0 28px;">Loading…</p>

  <div id="settings-gate" style="display:none;">
    <div class="ss-card" style="text-align:center;">
      <p id="settings-gate-msg" style="font-size:16px;color:var(--text);margin:0 0 16px;"></p>
      <button id="settings-signin-btn" class="ss-oauth-btn" style="width:auto;display:none;padding:10px 24px;">Sign in with Google</button>
    </div>
  </div>

  <div id="settings-content" style="display:none;">
    <div class="ss-card">
      <div style="font-weight:800;font-size:17px;color:var(--text);margin-bottom:4px;">Your classes</div>
      <p style="font-size:14px;color:var(--text-muted);margin:0 0 16px;">
        Pick the classes you're taking. The homepage will show just these — you can change this anytime.
      </p>
      <div id="class-list"></div>
      <button id="settings-save-btn" style="margin-top:6px;">Save</button>
      <div id="settings-status"></div>
    </div>
  </div>
</div>

<script>
var SUBJECTS = [
  { key: 'geometry', label: 'Geometry', color: '#d9a441' },
  { key: 'chemistry', label: 'Chemistry', color: '#0f7a70' },
  { key: 'algebra1', label: 'Algebra I', color: '#2563a8' },
  { key: 'algebra2', label: 'Algebra II', color: '#5b4bd8' },
  { key: 'aplang', label: 'AP English Lang & Comp', color: '#8b2942' },
  { key: 'globalhistory', label: 'Global History', color: '#b5541f' }
];

function ssEscapeHtml(s){
  var div = document.createElement('div');
  div.textContent = String(s == null ? '' : s);
  return div.innerHTML;
}

let SS_SESSION;

function ssLoginBoxHtml(){
  return '<a class="ss-oauth-btn" href="/auth/google/start">Continue with Google</a>'
    + '<a class="ss-oauth-btn" href="/auth/github/start">Continue with GitHub</a>'
    + '<div class="ss-status"></div>';
}

function ssToggleLoginPanel(){
  var panel = document.getElementById('ss-login-panel');
  if(!panel) return;
  var opening = !panel.classList.contains('open');
  panel.classList.toggle('open', opening);
  if(opening) panel.querySelector('.ss-login-box').innerHTML = ssLoginBoxHtml();
}

async function ssLogout(){
  try{ await fetch('/auth/logout', {method:'POST'}); }catch(e){}
  SS_SESSION = false;
  ssRenderAccountUI();
}

function ssRenderAccountUI(){
  var area = document.getElementById('ss-account-area');
  if(!area) return;
  if(SS_SESSION){
    area.innerHTML = '<div class="ss-account"><span class="ss-account-name">' + ssEscapeHtml(SS_SESSION.name) + '</span>'
      + '<button onclick="ssLogout()">Sign out</button></div>';
  }else{
    area.innerHTML = '<button id="ss-signin-btn" onclick="ssToggleLoginPanel()">Sign In</button>'
      + '<div id="ss-login-panel"><div class="ss-login-box"></div></div>';
  }
}

async function ssCheckSession(){
  try{
    var res = await fetch('/auth/me');
    var data = await res.json();
    SS_SESSION = data.loggedIn ? data : false;
  }catch(e){
    SS_SESSION = false;
  }
  ssRenderAccountUI();
  return SS_SESSION;
}

document.addEventListener('click', function(e){
  var panel = document.getElementById('ss-login-panel');
  var area = document.getElementById('ss-account-area');
  if(panel && panel.classList.contains('open') && area && !area.contains(e.target)){
    panel.classList.remove('open');
  }
});

function renderClassList(enrolled){
  var enrolledSet = new Set(enrolled || []);
  var list = document.getElementById('class-list');
  list.innerHTML = SUBJECTS.map(function(s){
    var checked = enrolledSet.has(s.key);
    return '<label class="class-row' + (checked ? ' checked' : '') + '" data-key="' + s.key + '">'
      + '<input type="checkbox" data-key="' + s.key + '"' + (checked ? ' checked' : '') + '/>'
      + '<span class="swatch" style="background:' + s.color + '"></span>'
      + '<span class="name">' + ssEscapeHtml(s.label) + '</span>'
      + '</label>';
  }).join('');
  list.querySelectorAll('input[type="checkbox"]').forEach(function(cb){
    cb.addEventListener('change', function(){
      cb.closest('.class-row').classList.toggle('checked', cb.checked);
    });
  });
}

async function saveEnrolledSubjects(){
  var btn = document.getElementById('settings-save-btn');
  var status = document.getElementById('settings-status');
  var checked = Array.prototype.slice.call(document.querySelectorAll('#class-list input[type="checkbox"]:checked'))
    .map(function(cb){ return cb.dataset.key; });

  status.textContent = '';
  status.className = '';
  btn.disabled = true;
  var original = btn.textContent;
  btn.textContent = 'Saving…';

  try{
    var res = await fetch('/api/enrolled-subjects', {
      method: 'POST',
      headers: {'Content-Type':'application/json'},
      body: JSON.stringify({ subjects: checked })
    });
    var data = await res.json();
    if(res.ok){
      status.textContent = 'Saved! Your homepage will now show just these classes.';
      status.className = 'ok';
    }else{
      status.textContent = data.error || 'Something went wrong — try again.';
      status.className = 'err';
    }
  }catch(e){
    status.textContent = 'Network error — try again.';
    status.className = 'err';
  }
  btn.disabled = false;
  btn.textContent = original;
}

async function initSettings(){
  var subtitle = document.getElementById('settings-subtitle');
  var gate = document.getElementById('settings-gate');
  var gateMsg = document.getElementById('settings-gate-msg');
  var signinBtn = document.getElementById('settings-signin-btn');
  var content = document.getElementById('settings-content');

  var session = await ssCheckSession();

  if(!session){
    subtitle.textContent = 'Sign in to manage your classes.';
    gate.style.display = 'block';
    gateMsg.textContent = 'You need to sign in to view settings.';
    signinBtn.style.display = 'inline-flex';
    signinBtn.onclick = function(){ window.location.href = '/auth/google/start'; };
    return;
  }

  subtitle.textContent = 'Manage your account and classes.';
  content.style.display = 'block';

  try{
    var res = await fetch('/api/progress');
    var blob = res.ok ? await res.json() : {};
    renderClassList(blob.enrolledSubjects || []);
  }catch(e){
    renderClassList([]);
  }

  document.getElementById('settings-save-btn').addEventListener('click', saveEnrolledSubjects);
}

initSettings();

function ssToggleTheme(){
  var isDark = document.documentElement.getAttribute('data-theme') === 'dark';
  if (isDark) {
    document.documentElement.removeAttribute('data-theme');
    try { localStorage.setItem('ss-theme', 'light'); } catch (e) {}
  } else {
    document.documentElement.setAttribute('data-theme', 'dark');
    try { localStorage.setItem('ss-theme', 'dark'); } catch (e) {}
  }
}
</script>
</body>
</html>
