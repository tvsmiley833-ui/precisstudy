<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>Set up your account — PrecisStudy</title>
<meta name="description" content="A one-time setup wizard: pick your classes, set study preferences, and take a short tour of PrecisStudy."/>
<meta name="robots" content="noindex"/>
<link rel="icon" type="image/png" href="/favicon.png"/>
<link rel="apple-touch-icon" href="/apple-touch-icon.png"/>
<link rel="preload" href="/fonts/nunito-latin.woff2" as="font" type="font/woff2" crossorigin/>
<link rel="stylesheet" href="/fonts/nunito.css"/>
<script>
(function(){
  // App launches (PWA start_url) always point here first, like the reference
  // app this mirrors. A student who already finished the wizard shouldn't
  // see it again on every open -- bounce straight to the dashboard unless
  // they explicitly asked to revisit it (?tour=1, e.g. from the command
  // palette's "redo setup" entry). This runs before anything renders, so a
  // returning student sees no flash of the wizard on the way to /dashboard.
  try {
    if (localStorage.getItem('ob-done-v2') === '1' && location.search.indexOf('tour=1') === -1) {
      location.replace('/dashboard');
      return;
    }
  } catch (e) { /* localStorage unavailable -- fall through and show the wizard */ }
  try {
    var saved = localStorage.getItem('ss-theme');
    if (saved !== 'light') document.documentElement.setAttribute('data-theme', 'dark');
  } catch (e) {}
})();
</script>
<style>
:root{
  --bg:#eef1ea; --bg-card:#fff; --bg-header:#ffffff;
  --border:#c8d2c5;
  --text:#233a31; --text-body:#33493d; --text-muted:#5a6f63; --nav-text:#3d5347;
  --accent:#1f6e46; --accent-bright:#268a58; --accent-hover:#175a39; --accent-solid:#1f6e46; --accent-solid-hover:#175a39;
  --chip-bg:#dde8df; --chip-text:#175a39;
  --danger:#b23a3a; --danger-soft:#fbeaea;
  --card-shadow:0 1px 3px rgba(35,58,49,.06),0 24px 48px -28px rgba(35,58,49,.20);
}
[data-theme="dark"]{
  --bg:#14302a; --bg-card:#1b3d33; --bg-header:#12291f;
  --border:#2f5346;
  --text:#f2f5ee; --text-body:#dbe6dd; --text-muted:#b7c9bc; --nav-text:#eef2ea;
  --accent:#4fbf85; --accent-bright:#63d199; --accent-hover:#3fa873; --accent-solid:#237750; --accent-solid-hover:#1a6644;
  --chip-bg:#22362c; --chip-text:#63d199;
  --danger:#f16565; --danger-soft:rgba(241,101,101,.14);
  --card-shadow:0 1px 3px rgba(0,0,0,.32),0 24px 48px -28px rgba(0,0,0,.5);
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{margin:0;font-family:'Nunito','Segoe UI',system-ui,sans-serif;background:var(--bg);color:var(--text)}
a{color:var(--accent)}
.skip-link{position:absolute;left:-9999px;top:auto}
.skip-link:focus{position:fixed;left:16px;top:16px;z-index:10000;background:var(--bg-card);border:2px solid var(--accent);color:var(--text);padding:8px 14px;border-radius:8px;font-weight:700}
:focus-visible{outline:3px solid var(--accent-bright);outline-offset:2px}
#theme-toggle{background:none;border:1px solid var(--border);color:var(--text-muted);border-radius:999px;
  width:34px;height:34px;display:flex;align-items:center;justify-content:center;cursor:pointer;flex-shrink:0}
#theme-toggle:hover{border-color:var(--accent-bright);color:var(--accent)}
#theme-toggle svg{width:17px;height:17px}
#theme-toggle .icon-sun{display:none}
[data-theme="dark"] #theme-toggle .icon-moon{display:none}
[data-theme="dark"] #theme-toggle .icon-sun{display:block}
[data-theme="dark"] .ss-logo-light{display:none!important}
[data-theme="dark"] .ss-logo-dark{display:inline!important}
.ss-oauth-btn{display:flex;align-items:center;justify-content:center;gap:10px;width:100%;box-sizing:border-box;
  padding:10px 14px;border-radius:12px;border:2px solid var(--border);background:var(--bg-card);color:var(--text);
  font-family:inherit;font-size:14px;font-weight:700;cursor:pointer;text-decoration:none;margin-bottom:9px;transition:all .15s}
.ss-oauth-btn:hover{border-color:var(--accent-bright);background:var(--bg)}
.ss-card{background:var(--bg-card);border:2px solid var(--border);border-radius:18px;padding:22px;box-shadow:var(--card-shadow)}
.ss-btn{padding:9px 18px;border-radius:999px;border:1px solid var(--border);background:var(--bg-card);color:var(--text);
  font-family:inherit;font-size:14px;font-weight:700;cursor:pointer;transition:all .15s}
.ss-btn:hover{border-color:var(--accent-bright)}
.ss-btn:disabled{opacity:.5;cursor:not-allowed}
.ss-btn-solid{background:var(--accent-solid);color:#fff;border-color:var(--accent-solid)}
.ss-btn-solid:hover{background:var(--accent-solid-hover);border-color:var(--accent-solid-hover)}
@media(max-width:640px){.header-bar{padding:14px 16px} .nav-links{gap:10px} .nav-hide-sm{display:none}}

.ob-wrap{max-width:680px;margin:0 auto;padding:40px 24px 90px}
.ob-progress{display:flex;align-items:center;gap:8px;margin-bottom:22px}
.ob-progress-step{flex:1;height:6px;border-radius:999px;background:var(--border)}
.ob-progress-step.done,.ob-progress-step.current{background:var(--accent)}
.ob-progress-label{font-size:13px;font-weight:700;color:var(--text-muted);margin-bottom:10px}
.ob-skip{font-size:13px;color:var(--text-muted);text-decoration:underline}
.ob-title{font-size:26px;font-weight:800;margin:4px 0 8px}
.ob-sub{font-size:15px;color:var(--text-muted);margin:0 0 22px;line-height:1.5}
.ob-actions{display:flex;justify-content:space-between;align-items:center;margin-top:24px;gap:12px;flex-wrap:wrap}
.ob-actions-right{display:flex;gap:10px}

.ob-cat{margin-bottom:18px}
.ob-cat-label{font-size:13px;font-weight:800;color:var(--text-muted);text-transform:uppercase;letter-spacing:.03em;margin:0 0 8px}
.ob-subject-row{display:flex;align-items:center;gap:10px;padding:9px 6px;border-radius:10px;border-bottom:1px solid var(--border)}
.ob-subject-row:last-child{border-bottom:none}
.ob-subject-row label{display:flex;align-items:center;gap:10px;flex:1;cursor:pointer;font-size:14.5px;font-weight:600}
.ob-subject-row input[type=checkbox]{width:18px;height:18px;accent-color:var(--accent);cursor:pointer;flex-shrink:0}
.ob-row-icon{width:22px;height:22px;flex-shrink:0;display:flex;align-items:center;justify-content:center}
.ob-row-icon svg{width:22px;height:22px}
.ob-count-chip{font-size:12.5px;font-weight:700;color:var(--chip-text);background:var(--chip-bg);border-radius:999px;padding:3px 10px}

.ob-pref-row{display:flex;align-items:center;justify-content:space-between;gap:16px;padding:14px 0;border-bottom:1px solid var(--border)}
.ob-pref-row:last-child{border-bottom:none}
.ob-pref-text strong{display:block;font-size:14.5px;font-weight:700}
.ob-pref-text span{display:block;font-size:13px;color:var(--text-muted);margin-top:2px}
.ob-switch{position:relative;display:inline-block;width:42px;height:24px;flex-shrink:0}
.ob-switch input{opacity:0;width:0;height:0}
.ob-switch .ob-slider{position:absolute;inset:0;background:var(--border);border-radius:999px;cursor:pointer;transition:.15s}
.ob-switch .ob-slider:before{content:"";position:absolute;width:18px;height:18px;left:3px;top:3px;background:#fff;border-radius:50%;transition:.15s}
.ob-switch input:checked + .ob-slider{background:var(--accent)}
.ob-switch input:checked + .ob-slider:before{transform:translateX(18px)}
.ob-switch input:focus-visible + .ob-slider{outline:3px solid var(--accent-bright);outline-offset:2px}

.ob-goal-row{display:flex;gap:12px;margin-top:6px}
.ob-goal-field{flex:1}
.ob-goal-field label{display:block;font-size:12.5px;font-weight:700;color:var(--text-muted);margin-bottom:4px}
.ob-goal-field input{width:100%;padding:9px 10px;border-radius:10px;border:2px solid var(--border);background:var(--bg-card);color:var(--text);font-family:inherit;font-size:14px}

.ob-tour-group{margin-bottom:20px}
.ob-tour-group-label{font-size:13px;font-weight:800;color:var(--text-muted);text-transform:uppercase;letter-spacing:.03em;margin:0 0 8px}
.ob-tour-item{display:flex;align-items:flex-start;justify-content:space-between;gap:14px;padding:12px 0;border-bottom:1px solid var(--border)}
.ob-tour-item:last-child{border-bottom:none}
.ob-tour-text strong{display:block;font-size:14.5px;font-weight:700}
.ob-tour-text span{display:block;font-size:13px;color:var(--text-muted);margin-top:3px;line-height:1.4}
.ob-tour-icon{width:24px;height:24px;flex-shrink:0;display:flex;align-items:center;justify-content:center;margin-top:1px}
.ob-tour-icon svg{width:24px;height:24px}
.ob-tour-item-body{display:flex;align-items:flex-start;gap:10px;flex:1}
.ob-tour-seen{font-size:11.5px;font-weight:700;color:var(--accent);margin-top:4px;display:inline-block}
.ob-visit-btn{flex-shrink:0;text-decoration:none;padding:8px 14px;border-radius:999px;border:1px solid var(--border);background:var(--bg-card);color:var(--text);font-weight:700;font-size:13px;white-space:nowrap}
.ob-visit-btn:hover{border-color:var(--accent-bright)}

.ob-finish-summary{margin:0 0 22px}
.ob-finish-item{display:flex;justify-content:space-between;padding:10px 0;border-bottom:1px solid var(--border);font-size:14px}
.ob-finish-item:last-child{border-bottom:none}
.ob-finish-item span:last-child{color:var(--text-muted)}
.ob-toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--text);color:var(--bg);padding:10px 18px;border-radius:10px;font-size:13.5px;font-weight:700;z-index:9999;opacity:0;pointer-events:none;transition:opacity .2s}
.ob-toast.show{opacity:1}
.sr-only{position:absolute;width:1px;height:1px;padding:0;margin:-1px;overflow:hidden;clip:rect(0,0,0,0);white-space:nowrap;border:0}
.ob-points{font-size:13px;font-weight:700;color:var(--accent);white-space:nowrap}
@keyframes obStepIn{from{opacity:0;transform:scale(.98)}to{opacity:1;transform:scale(1)}}
.ob-step:not([hidden]){animation:obStepIn .28s cubic-bezier(.2,.8,.2,1)}
@media(prefers-reduced-motion:reduce){*{animation-duration:.001ms!important;animation-iteration-count:1!important;transition-duration:.001ms!important;scroll-behavior:auto!important}}

</style>

<style>
/* ---- Setup with Sage: one question per screen ---- */
@font-face{font-family:'Fraunces';font-style:normal;font-weight:500 700;font-display:swap;src:url('/fonts/fraunces-latin.woff2') format('woff2')}
.ob{max-width:620px;margin:0 auto;padding:18px 20px 120px;min-height:calc(100vh - 70px);display:flex;flex-direction:column}
.ob-top{display:flex;align-items:center;gap:12px;margin-bottom:22px}
.ob-back{width:36px;height:36px;border-radius:50%;border:1px solid var(--border);background:transparent;color:var(--text);cursor:pointer;font-size:18px;line-height:1}
.ob-back[hidden]{display:inline-block;visibility:hidden}
.ob-bar{flex:1;display:flex;gap:6px}
.ob-bar i{flex:1;height:6px;border-radius:99px;background:var(--border);overflow:hidden;position:relative}
.ob-bar i::after{content:"";position:absolute;inset:0;background:var(--accent);transform:scaleX(0);transform-origin:left;transition:transform .45s cubic-bezier(.2,.8,.2,1)}
.ob-bar i.on::after{transform:scaleX(1)}
.ob-xp{position:relative;font-weight:800;font-size:13px;color:var(--accent);white-space:nowrap;background:color-mix(in oklab,var(--accent) 14%,transparent);padding:5px 10px;border-radius:99px}
.ob-xp em{position:absolute;right:4px;top:-18px;font-style:normal;animation:obPop 1.1s ease forwards}
@keyframes obPop{0%{opacity:0;transform:translateY(6px)}20%{opacity:1}100%{opacity:0;transform:translateY(-12px)}}
.ob-skip{font-size:13px;color:var(--text-muted);text-decoration:underline;white-space:nowrap}
.ob-screen{flex:1;display:flex;flex-direction:column;animation:obIn .35s cubic-bezier(.2,.8,.2,1)}
@keyframes obIn{from{opacity:0;transform:translateX(18px)}to{opacity:1;transform:none}}
.ob-screen.back{animation-name:obInBack}
@keyframes obInBack{from{opacity:0;transform:translateX(-18px)}to{opacity:1;transform:none}}
.ob-sage{display:flex;align-items:flex-end;gap:12px;margin-bottom:18px}
.ob-sage .owl{flex-shrink:0}
.ob-bubble{position:relative;flex:1;background:var(--bg-card);border:1px solid var(--border);border-radius:18px;padding:12px 16px;margin-bottom:18px;font-size:15.5px;line-height:1.45;color:var(--text)}
.ob-bubble::before{content:"";position:absolute;left:-8px;bottom:16px;width:14px;height:14px;background:inherit;border-left:1px solid var(--border);border-bottom:1px solid var(--border);transform:rotate(45deg)}
.ob-bubble small{display:block;font-size:11px;font-weight:800;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);margin-bottom:2px}
.ob-h{font-family:'Fraunces',Georgia,serif;font-weight:600;font-size:clamp(26px,5vw,34px);line-height:1.12;letter-spacing:-.01em;margin:0 0 6px}
.ob-sub{color:var(--text-muted);font-size:15px;margin:0 0 18px}
.ob-hero{text-align:center;align-items:center;justify-content:center}
.ob-hero .owl{margin:12px 0 6px}
.ob-hero .ob-h{font-size:clamp(32px,7vw,44px)}
.ob-perks{display:grid;gap:10px;width:100%;max-width:420px;margin:18px 0 0;text-align:left}
.ob-perk{display:flex;gap:12px;align-items:center;padding:12px 14px;border-radius:14px;background:var(--bg-card);border:1px solid var(--border);font-size:14.5px}
.ob-perk b{display:block}
.ob-perk span{color:var(--text-muted)}
.ob-perk svg{flex-shrink:0;color:var(--accent)}
.ob-search{width:100%;padding:12px 14px;border-radius:12px;border:1px solid var(--border);background:var(--bg-card);color:var(--text);font:inherit;font-size:15px;margin-bottom:10px}
.ob-chips{display:flex;gap:6px;overflow-x:auto;padding-bottom:6px;margin-bottom:10px;scrollbar-width:none}
.ob-chips::-webkit-scrollbar{display:none}
.ob-chip{flex-shrink:0;padding:7px 13px;border-radius:99px;border:1px solid var(--border);background:transparent;color:var(--text);font:600 13px inherit;cursor:pointer}
.ob-chip.on{background:var(--accent-solid,var(--accent));border-color:var(--accent-solid,var(--accent));color:#fff}
.ob-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px}
.ob-tile{position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:8px;padding:14px;border-radius:14px;border:1.5px solid var(--border);background:var(--bg-card);color:var(--text);font:700 14px inherit;text-align:left;cursor:pointer;transition:border-color .15s,transform .15s}
.ob-tile:hover{transform:translateY(-1px);border-color:var(--accent)}
.ob-tile .ic{color:var(--accent);width:30px;height:30px}
.ob-tile .ic svg{width:30px;height:30px}
.ob-tile[aria-pressed="true"]{border-color:var(--accent);background:color-mix(in oklab,var(--accent) 12%,var(--bg-card))}
.ob-tile[aria-pressed="true"]::after{content:"✓";position:absolute;top:10px;right:10px;width:22px;height:22px;border-radius:50%;background:var(--accent);color:#fff;display:grid;place-items:center;font-size:13px}
.ob-empty{color:var(--text-muted);padding:20px 0;text-align:center}
.ob-opts{display:grid;gap:10px}
.ob-opt{display:flex;align-items:center;gap:14px;padding:16px;border-radius:16px;border:1.5px solid var(--border);background:var(--bg-card);color:var(--text);font:inherit;text-align:left;cursor:pointer;transition:border-color .15s,transform .15s}
.ob-opt:hover{border-color:var(--accent);transform:translateY(-1px)}
.ob-opt[aria-checked="true"]{border-color:var(--accent);background:color-mix(in oklab,var(--accent) 12%,var(--bg-card))}
.ob-opt .big{font-family:'Fraunces',Georgia,serif;font-size:22px;font-weight:600;min-width:62px;color:var(--accent)}
.ob-opt b{display:block;font-size:15.5px}
.ob-opt span{font-size:13.5px;color:var(--text-muted)}
.ob-switch{margin-left:auto;width:44px;height:26px;border-radius:99px;background:var(--border);position:relative;flex-shrink:0;transition:background .2s}
.ob-switch::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;transition:transform .2s}
.ob-opt[aria-checked="true"] .ob-switch{background:var(--accent)}
.ob-opt[aria-checked="true"] .ob-switch::after{transform:translateX(18px)}
.ob-foot{position:fixed;left:0;right:0;bottom:0;padding:14px 20px calc(14px + env(safe-area-inset-bottom));background:linear-gradient(to top,var(--bg) 70%,transparent);z-index:5}
.ob-foot-in{max-width:620px;margin:0 auto;display:flex;align-items:center;gap:12px}
.ob-foot-note{font-size:13.5px;color:var(--text-muted)}
.ob-cta{margin-left:auto;padding:14px 28px;border-radius:99px;border:0;background:var(--accent-solid,var(--accent));color:#fff;font:800 16px inherit;cursor:pointer;box-shadow:0 8px 22px -8px var(--accent-solid,var(--accent))}
.ob-cta:disabled{opacity:.45;cursor:not-allowed;box-shadow:none}
.ob-cta.full{flex:1;margin-left:0}
.ob-ach{display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:16px;border:1px solid var(--accent);background:color-mix(in oklab,var(--accent) 10%,var(--bg-card));margin:10px 0 16px;text-align:left}
.ob-ach b{display:block}
.ob-ach small{color:var(--text-muted)}
.ob-plan{display:grid;gap:8px;width:100%;text-align:left}
.ob-plan div{display:flex;justify-content:space-between;gap:12px;padding:12px 14px;border-radius:12px;background:var(--bg-card);border:1px solid var(--border);font-size:14.5px}
.ob-plan div span:first-child{color:var(--text-muted)}
.ob-plan div span:last-child{font-weight:700;text-align:right}
.ob-gate{max-width:420px;margin:40px auto;text-align:center}
.ob-gate .ss-oauth-btn{margin-top:10px}
@media (prefers-reduced-motion:reduce){.ob-screen{animation:none}.ob-bar i::after{transition:none}.ob-xp em{animation:none;opacity:0}}
</style>
</head>
<body>
<a href="/dashboard" class="skip-link" onclick="obSkip(event)">Skip setup and go to dashboard</a>

<div role="banner" class="header-bar" style="display:flex;align-items:center;justify-content:space-between;padding:18px 32px;background:var(--bg-header);border-bottom:1px solid var(--border);">
  <a href="/" style="font-weight:800;font-size:22px;color:var(--nav-text);display:flex;align-items:center;gap:8px;text-decoration:none;">
    <span style="display:inline-block;width:28px;height:28px;position:relative;flex-shrink:0;"><img src="/logo-icon.png" alt="" width="28" height="28" style="border-radius:6px;position:absolute;inset:0;" class="ss-logo-light"/><img src="/logo-icon-dark.png" alt="" width="28" height="28" style="border-radius:6px;position:absolute;inset:0;display:none;" class="ss-logo-dark"/></span>PrecisStudy

<script type="module">
import { owlSvg, OWL_CSS } from "/shared/owl.js";
import { chalkIcon } from "/shared/chalk-icons.js";
let getIcon = null;
try { getIcon = (await import("/shared/subject-icons.js")).getSubjectIcon; } catch (e) { /* icons are decorative */ }

const style = document.createElement("style"); style.textContent = OWL_CSS; document.head.appendChild(style);

// Guide folders that differ from the progress keys.
const PATHS = { aplang: "ap-lang", globalhistory: "global-history", apbiology: "ap-biology" };
const STEPS = ["welcome", "classes", "test", "time", "reminders", "done"];
const XP = { classes: 25, test: 20, time: 20, reminders: 10 };   // 75 total = SETUP_XP on the server
const TESTS = [
  { v: 7, big: "1 wk", t: "This week", d: "Let's focus on what matters most." },
  { v: 14, big: "2 wk", t: "In about two weeks", d: "Plenty of time for steady practice." },
  { v: 30, big: "1 mo", t: "In about a month", d: "We'll build it up unit by unit." },
  { v: 90, big: "3 mo+", t: "Later this year", d: "Slow and steady, a little each day." },
  { v: 0, big: "?", t: "Not sure yet", d: "No problem, I'll keep it flexible." },
];
const TIMES = [
  { v: 10, t: "Quick", d: "A few flashcards and a question or two" },
  { v: 20, t: "Regular", d: "A short quiz every day" },
  { v: 30, t: "Serious", d: "A unit's worth of practice" },
  { v: 45, t: "Intense", d: "Deep study sessions" },
];
const S = { step: 0, dir: 1, enrolled: [], cat: "all", q: "", days: null, minutes: null,
  prefs: { daily: true, streak: true, blocks: true }, xp: 0, earned: {} };

const $ = (id) => document.getElementById(id);
const esc = (s) => String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
const owl = (mood, size, extra = {}) => `<div class="owl">${owlSvg({ mood, size, ...extra })}</div>`;
const say = (mood, text, size = 72) => `<div class="ob-sage">${owl(mood, size)}<div class="ob-bubble"><small>Sage</small>${text}</div></div>`;

async function api(url, body) {
  const init = { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify(body) };
  if (window.ssOptimistic && window.ssOptimistic.fetch) return window.ssOptimistic.fetch(url, init);
  const r = await fetch(url, init);
  const b = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error((b && b.error) || "Request failed");
  return b;
}

function award(step) {
  if (!XP[step] || S.earned[step]) return;
  S.earned[step] = true; S.xp += XP[step];
  $("ob-xp").innerHTML = S.xp + ' XP<em aria-hidden="true">+' + XP[step] + "</em>";
}

function foot(html) { $("ob-foot").hidden = !html; $("ob-foot-in").innerHTML = html || ""; }

function go(n, dir = 1) {
  S.step = Math.max(0, Math.min(STEPS.length - 1, n)); S.dir = dir;
  try { localStorage.setItem("ob-step-v3", String(S.step)); } catch (e) {}
  render();
}
window.obBack = () => go(S.step - 1, -1);
window.obSkip = (e) => { if (e) e.preventDefault(); try { localStorage.setItem("ob-done-v2", "1"); } catch (x) {} location.href = "/dashboard"; };

function render() {
  const name = STEPS[S.step];
  const bar = $("ob-bar");
  const done = Math.max(0, Math.min(4, S.step - 1 + (name === "done" ? 1 : 0)));
  bar.querySelectorAll("i").forEach((el, i) => el.classList.toggle("on", i < done));
  bar.setAttribute("aria-valuenow", String(done));
  $("ob-back").hidden = S.step === 0 || name === "done";
  const scr = $("ob-screen");
  scr.className = "ob-screen" + (S.dir < 0 ? " back" : "") + (name === "welcome" || name === "done" ? " ob-hero" : "");
  scr.innerHTML = VIEWS[name]();
  void scr.offsetWidth;
  (BIND[name] || (() => {}))();
  window.scrollTo(0, 0);
}

const PERKS = [
  ["book", "Guides for your real classes", "Notes, flashcards and quizzes, unit by unit"],
  ["bars", "A plan that fits your test date", "I'll pace things so you're ready in time"],
  ["check", "XP, streaks and quests", "Every step, starting right now, earns XP"],
];
const icon = (n) => `<svg viewBox="0 0 64 64" width="30" height="30" fill="none" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">${chalkIcon(n, 0, 0, 64)}</svg>`;

const VIEWS = {
  welcome: () => {
    foot(`<button class="ob-cta full" id="ob-next">Let's set you up</button>`);
    return `${owl("idle", 150)}
      <h1 class="ob-h">Hi, I'm Sage!</h1>
      <p class="ob-sub">I'll build your study plan in about a minute.</p>
      <div class="ob-perks">${PERKS.map(([i, b, s]) => `<div class="ob-perk">${icon(i)}<div><b>${b}</b><span>${s}</span></div></div>`).join("")}</div>`;
  },
  classes: () => {
    const cats = [{ key: "all", label: "All" }].concat(SUBJECT_CATEGORIES);
    foot(`<span class="ob-foot-note" id="ob-count"></span><button class="ob-cta" id="ob-next">Continue</button>`);
    return `${say(S.enrolled.length ? "happy" : "idle", S.enrolled.length ? "Nice! Add any others you're taking." : "Which classes are you taking? Tap all that apply.")}
      <h1 class="ob-h">Your classes</h1>
      <input class="ob-search" id="ob-q" type="search" placeholder="Search classes…" aria-label="Search classes" value="${esc(S.q)}">
      <div class="ob-chips" role="group" aria-label="Filter by category">${cats.map((c) => `<button type="button" class="ob-chip${S.cat === c.key ? " on" : ""}" data-cat="${c.key}">${esc(c.label)}</button>`).join("")}</div>
      <div class="ob-grid" id="ob-grid"></div>`;
  },
  test: () => {
    foot(`<button class="ob-cta" id="ob-next" ${S.days === null ? "disabled" : ""}>Continue</button>`);
    return `${say("think", "When's your next big test or final?")}
      <h1 class="ob-h">Your test date</h1>
      <div class="ob-opts" role="radiogroup" aria-label="Next test">${TESTS.map((o) => `<button type="button" class="ob-opt" role="radio" aria-checked="${S.days === o.v}" data-v="${o.v}"><span class="big">${o.big}</span><span><b>${o.t}</b><span>${o.d}</span></span></button>`).join("")}</div>`;
  },
  time: () => {
    foot(`<button class="ob-cta" id="ob-next" ${S.minutes === null ? "disabled" : ""}>Continue</button>`);
    return `${say("idle", "How much time can you give me each day? Small and steady beats cramming.")}
      <h1 class="ob-h">Your daily goal</h1>
      <div class="ob-opts" role="radiogroup" aria-label="Daily study time">${TIMES.map((o) => `<button type="button" class="ob-opt" role="radio" aria-checked="${S.minutes === o.v}" data-v="${o.v}"><span class="big">${o.v}m</span><span><b>${o.t}</b><span>${o.d}</span></span></button>`).join("")}</div>`;
  },
  reminders: () => {
    foot(`<button class="ob-cta" id="ob-next">Continue</button>`);
    const row = (k, t, d) => `<button type="button" class="ob-opt" role="switch" aria-checked="${!!S.prefs[k]}" data-k="${k}"><span><b>${t}</b><span>${d}</span></span><span class="ob-switch" aria-hidden="true"></span></button>`;
    return `${say("happy", "Want me to nudge you? I'll keep it friendly, promise.")}
      <h1 class="ob-h">Reminders</h1>
      <div class="ob-opts">${row("daily", "Daily reminder", "A nudge if you haven't studied yet today")}${row("streak", "Streak alert", "A heads-up before your streak breaks")}${row("blocks", "Study-block reminders", "Just before a session on your schedule")}</div>`;
  },
  done: () => {
    const first = SUBJECTS.find((s) => S.enrolled.includes(s.key));
    const count = S.enrolled.length;
    const test = TESTS.find((t) => t.v === S.days);
    foot(first
      ? `<a class="ob-cta full" style="text-align:center;text-decoration:none" href="/${PATHS[first.key] || first.key}" onclick="obFinish()">Start with ${esc(first.label)}</a>`
      : `<a class="ob-cta full" style="text-align:center;text-decoration:none" href="/dashboard" onclick="obFinish()">Go to my dashboard</a>`);
    return `${owl("cheer", 140, { cap: true })}
      <h1 class="ob-h">You're all set!</h1>
      <div class="ob-ach" role="status" id="ob-ach">${owlSvg({ mood: "happy", cap: true, size: 44, label: "" })}<span><b>Achievement unlocked: First Flight</b><small id="ob-ach-note">+${S.xp} XP · Sage earned a graduation cap</small></span></div>
      <div class="ob-plan">
        <div><span>Classes</span><span>${count ? count + (count === 1 ? " class" : " classes") : "None yet"}</span></div>
        <div><span>Next test</span><span>${test ? test.t : "Not set"}</span></div>
        <div><span>Daily goal</span><span>${S.minutes ? S.minutes + " min a day" : "Not set"}</span></div>
      </div>
      ${first ? `<p class="ob-sub" style="margin-top:14px"><a href="/dashboard" onclick="obFinish()">Or go to your dashboard</a></p>` : ""}`;
  },
};

function renderGrid() {
  const q = S.q.trim().toLowerCase();
  const list = SUBJECTS.filter((s) => (S.cat === "all" || s.cat === S.cat) && (!q || s.label.toLowerCase().includes(q)));
  $("ob-grid").innerHTML = list.length ? list.map((s) => {
    const ic = getIcon && getIcon(s.key);
    return `<button type="button" class="ob-tile" data-k="${s.key}" aria-pressed="${S.enrolled.includes(s.key)}"><span class="ic" aria-hidden="true">${ic ? ic.svg : ""}</span>${esc(s.label)}</button>`;
  }).join("") : `<p class="ob-empty">No classes match "${esc(S.q)}".</p>`;
  const n = S.enrolled.length;
  $("ob-count").textContent = n ? n + " selected" : "Pick at least one";
  $("ob-next").disabled = !n;
}

const pick = (sel, onPick) => document.querySelectorAll(sel).forEach((b) => b.addEventListener("click", () => onPick(b)));
const next = (fn) => $("ob-next") && $("ob-next").addEventListener("click", fn);

const BIND = {
  welcome: () => next(() => go(1)),
  classes: () => {
    renderGrid();
    $("ob-q").addEventListener("input", (e) => { S.q = e.target.value; renderGrid(); });
    pick(".ob-chip", (b) => { S.cat = b.dataset.cat; document.querySelectorAll(".ob-chip").forEach((c) => c.classList.toggle("on", c === b)); renderGrid(); });
    $("ob-grid").addEventListener("click", (e) => {
      const t = e.target.closest(".ob-tile"); if (!t) return;
      const k = t.dataset.k, i = S.enrolled.indexOf(k);
      if (i === -1) S.enrolled.push(k); else S.enrolled.splice(i, 1);
      const subj = SUBJECTS.find((s) => s.key === k);
      const bub = document.querySelector(".ob-bubble");
      if (bub && i === -1 && subj) bub.innerHTML = "<small>Sage</small>" + (S.enrolled.length >= 5 ? S.enrolled.length + " classes? Ambitious. I like it." : "Ooh, " + esc(subj.label) + "! Good pick.");
      renderGrid();
    });
    next(async () => {
      const btn = $("ob-next"); btn.disabled = true; btn.textContent = "Saving…";
      try { await api("/api/enrolled-subjects", { subjects: S.enrolled }); award("classes"); go(2); }
      catch (e) { btn.disabled = false; btn.textContent = "Try again"; }
    });
  },
  test: () => {
    pick(".ob-opt", (b) => { S.days = Number(b.dataset.v); document.querySelectorAll(".ob-opt").forEach((o) => o.setAttribute("aria-checked", String(o === b))); $("ob-next").disabled = false; });
    next(() => { award("test"); go(3); });
  },
  time: () => {
    pick(".ob-opt", (b) => { S.minutes = Number(b.dataset.v); document.querySelectorAll(".ob-opt").forEach((o) => o.setAttribute("aria-checked", String(o === b))); $("ob-next").disabled = false; });
    next(async () => {
      const btn = $("ob-next"); btn.disabled = true; btn.textContent = "Saving…";
      try {
        if (S.days > 0 && S.minutes > 0) await api("/api/goal", { days: S.days, minutesPerDay: S.minutes });
        award("time"); go(4);
      } catch (e) { btn.disabled = false; btn.textContent = "Try again"; }
    });
  },
  reminders: () => {
    pick(".ob-opt", (b) => { const k = b.dataset.k; S.prefs[k] = !S.prefs[k]; b.setAttribute("aria-checked", String(S.prefs[k])); });
    next(async () => {
      const btn = $("ob-next"); btn.disabled = true; btn.textContent = "Saving…";
      try { await api("/api/notification-prefs", S.prefs); award("reminders"); go(5); }
      catch (e) { btn.disabled = false; btn.textContent = "Try again"; }
    });
  },
  done: () => {
    try { localStorage.setItem("ob-done-v2", "1"); localStorage.removeItem("ob-step-v3"); } catch (e) {}
    api("/api/quest/claim", { scope: "once", key: "setup" }).then((d) => {
      if (d && d.xpAwarded) $("ob-ach-note").textContent = "+" + d.xpAwarded + " XP added to your Quest XP · Sage earned a graduation cap";
    }).catch(() => { /* the reward is a bonus; finishing works without it */ });
  },
};
window.obToggleTheme = () => {
  const dark = document.documentElement.getAttribute("data-theme") === "dark";
  if (dark) document.documentElement.removeAttribute("data-theme"); else document.documentElement.setAttribute("data-theme", "dark");
  try { localStorage.setItem("ss-theme", dark ? "light" : "dark"); } catch (e) {}
};
window.obFinish = () => { try { localStorage.setItem("ob-done-v2", "1"); } catch (e) {} };

// ---- start ----
let me = { loggedIn: false };
try { me = await (await fetch("/auth/me")).json(); } catch (e) {}
if (!me.loggedIn) {
  $("ob-gate").hidden = false;
  $("ob-gate-owl").innerHTML = owlSvg({ mood: "idle", size: 130 });
  $("ob-login-box").innerHTML = '<a class="ss-oauth-btn" href="/auth/google/start?next=' + encodeURIComponent(location.pathname) + '">Continue with Google</a>'
    + '<a class="ss-oauth-btn" href="/auth/github/start?next=' + encodeURIComponent(location.pathname) + '">Continue with GitHub</a>';
} else {
  $("ob-app").hidden = false;
  try {
    const r = await fetch("/api/progress");
    if (r.ok) {
      const blob = await r.json();
      S.enrolled = Array.isArray(blob.enrolledSubjects) ? blob.enrolledSubjects.slice() : [];
      const p = blob.notificationPrefs || {};
      S.prefs = { daily: p.daily !== false, streak: p.streak !== false, blocks: p.blocks !== false };
      if (blob.goal) { S.days = TESTS.some((t) => t.v === blob.goal.days) ? blob.goal.days : null; S.minutes = TIMES.some((t) => t.v === blob.goal.minutesPerDay) ? blob.goal.minutesPerDay : null; }
    }
  } catch (e) { /* defaults */ }
  let resume = 0;
  try { resume = Number(localStorage.getItem("ob-step-v3")) || 0; } catch (e) {}
  go(resume > 0 && resume < STEPS.length - 1 ? resume : 0);
}
</script>
